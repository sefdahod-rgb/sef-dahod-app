function calc(){
let t=0;
document.querySelectorAll('.fee:checked').forEach(c=>t+=parseInt(c.value));
document.getElementById('tot').innerText='₹'+t;
document.getElementById('payBtn').disabled=t==0;
}

function pay(){
let t=0, names=[];
document.querySelectorAll('.fee:checked').forEach(c=>{t+=parseInt(c.value); names.push(c.dataset.n);});
if(t==0) return;
var opt={
key:KEY,
amount:t*100,
currency:"INR",
name:"SEF Dahod - Rainbow Public School",
description: names.join(', ')+' - '+cur.name+' ('+cur.id+')',
handler: function(r){alert('Payment Success! ID:'+r.razorpay_payment_id+'\n'+cur.name+' ka payment ho gaya!');},
prefill:{name:cur.father||cur.name, contact:cur.mobile||"9723675167"},
theme:{color:"#4f46e5"}
};
var rz=new Razorpay(opt);
rz.open();
}
