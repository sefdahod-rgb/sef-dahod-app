<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEF Dahod - DAMSES Style</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f5f7fb] font-sans">
<div id="app"></div>
<script>
const DEFAULT_STUDENTS = [
{"id":"52","name":"Mayank Sureshbhai Bariya","class":"8th","father":"Sureshbhai","mobile":"9723675167","fees":30000,"photo":"M"},
{"id":"69","name":"Dhearya Kiritkumar Parmar","class":"8th","father":"Kiritkumar","mobile":"9723675168","fees":30000,"photo":"D"},
{"id":"74","name":"Vanshkumar Sunilbhai Devda","class":"8th","father":"Sunilbhai","mobile":"9723675169","fees":30000,"photo":"V"},
{"id":"109","name":"Purab Ishwarbhai Bamaniya","class":"7th","father":"Ishwarbhai","mobile":"9723675170","fees":25000,"photo":"P"},
{"id":"110","name":"Damini Kalubhai Bariya","class":"7th","father":"Kalubhai","mobile":"9723675171","fees":25000,"photo":"D"}
];

function loadStudents(){
  let s = localStorage.getItem('sef_students_v2');
  if(!s){
    // load from old if exists
    let old = localStorage.getItem('sef_students');
    if(old) return JSON.parse(old);
    return DEFAULT_STUDENTS;
  }
  return JSON.parse(s);
}
function saveStudents(arr){
  localStorage.setItem('sef_students_v2', JSON.stringify(arr));
}
let STUDENTS = loadStudents();
let cur=null;
const RAZOR_KEY="rzp_live_SeDR91zuvNa9fG";

function loginPage(msg=""){
document.getElementById('app').innerHTML=`
<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#4f46e5] to-[#7c3aed]">
<div class="bg-white rounded-[24px] p-7 w-full max-w-sm shadow-2xl">
<div class="text-center mb-6">
<div class="w-16 h-16 bg-[#4f46e5] text-white rounded-[16px] flex items-center justify-center mx-auto font-black text-2xl">SEF</div>
<h1 class="font-black text-xl mt-3">SEF DAHOD</h1>
<p class="text-xs text-gray-500">Rainbow Public School | DAMSES Style</p>
${msg?`<p class="text-xs text-red-600 bg-red-50 p-2 rounded mt-2">${msg}</p>`:""}
</div>
<div class="space-y-3">
<input id="uid" placeholder="Admission No (e.g. 52)" class="w-full h-12 border-2 border-gray-100 focus:border-[#4f46e5] rounded-xl px-4 outline-none">
<input id="pwd" type="password" placeholder="Password" class="w-full h-12 border-2 border-gray-100 focus:border-[#4f46e5] rounded-xl px-4 outline-none">
<button onclick="doLogin()" class="w-full h-12 bg-[#4f46e5] text-white rounded-xl font-bold shadow-lg">Login <i class="fa-solid fa-arrow-right ml-2"></i></button>
</div>
<div class="mt-5 bg-[#f5f7ff] p-3 rounded-xl text-[11px] leading-5">
<b>Demo Accounts:</b><br>
Student: <b>52 / 52</b> , 69 / 69 , 109 / 109<br>
Admin: <b>admin / admin</b> - Edit/Delete available
</div>
</div>
</div>`;
}

function doLogin(){
  const u=document.getElementById('uid').value.trim();
  const p=document.getElementById('pwd').value.trim();
  STUDENTS=loadStudents();
  if(u.toLowerCase()=='admin' && p.toLowerCase()=='admin'){ cur={id:'ADMIN', name:'Admin'}; adminPage(); return; }
  const s=STUDENTS.find(x=>x.id==u);
  if(!s){ loginPage("Admission No "+u+" nahi mila! 52 se try karo"); return; }
  if(u!=p){ loginPage("Password galat! Password = Admission No"); return; }
  cur=s; studentHome();
}

function studentHome(){
const s=cur;
document.getElementById('app').innerHTML=`
<div class="max-w-md mx-auto min-h-screen bg-[#f5f7fb] pb-20">
<!-- Header like DAMSES -->
<div class="bg-gradient-to-br from-[#4f46e5] to-[#7c3aed] p-6 rounded-b-[32px] text-white relative overflow-hidden">
<div class="absolute top-0 right-0 w-40 h-40 bg-white/10 rounded-full -mr-10 -mt-10"></div>
<div class="flex justify-between items-center relative z-10">
<div class="flex items-center gap-3">
<div class="w-14 h-14 bg-white text-[#4f46e5] rounded-full flex items-center justify-center font-black text-xl shadow">${s.photo||s.name[0]}</div>
<div>
<h2 class="font-bold text-[15px] leading-tight">${s.name}</h2>
<p class="text-[11px] opacity-80">Adm: ${s.id} | Class: ${s.class}</p>
</div>
</div>
<button onclick="loginPage()" class="w-8 h-8 bg-white/20 rounded-full"><i class="fa-solid fa-right-from-bracket text-xs"></i></button>
</div>
<!-- Profile Card -->
<div class="mt-5 bg-white/95 backdrop-blur rounded-[20px] p-4 text-gray-800 flex gap-4">
<div class="flex-1">
<p class="text-[10px] text-gray-400 uppercase tracking-widest">Father Name</p><p class="font-bold text-sm">${s.father}</p>
<p class="text-[10px] text-gray-400 uppercase mt-2">Mobile</p><p class="font-bold text-sm">${s.mobile}</p>
</div>
<div class="flex-1 border-l pl-4">
<p class="text-[10px] text-gray-400 uppercase tracking-widest">Annual Fees</p><p class="font-bold text-sm">₹${s.fees}</p>
<p class="text-[10px] text-gray-400 uppercase mt-2">Status</p><p class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full inline-block">Active Student</p>
</div>
</div>
</div>

<!-- Quick Actions Grid like DAMSES -->
<div class="p-4 grid grid-cols-2 gap-3 -mt-4">
<div onclick="feesPage()" class="bg-white rounded-[20px] p-4 shadow-sm border hover:shadow-md cursor-pointer">
<div class="w-10 h-10 bg-[#eef2ff] text-[#4f46e5] rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-indian-rupee-sign"></i></div>
<h3 class="font-bold text-sm">Fees Payment</h3><p class="text-[11px] text-gray-400">Pay online UPI/QR/Card</p>
</div>
<div class="bg-white rounded-[20px] p-4 shadow-sm border opacity-70">
<div class="w-10 h-10 bg-green-50 text-green-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-clipboard-check"></i></div>
<h3 class="font-bold text-sm">Attendance</h3><p class="text-[11px] text-gray-400">95% Present</p>
</div>
<div class="bg-white rounded-[20px] p-4 shadow-sm border opacity-70">
<div class="w-10 h-10 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-book-open"></i></div>
<h3 class="font-bold text-sm">Homework</h3><p class="text-[11px] text-gray-400">2 Pending</p>
</div>
<div class="bg-white rounded-[20px] p-4 shadow-sm border opacity-70">
<div class="w-10 h-10 bg-pink-50 text-pink-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-bell"></i></div>
<h3 class="font-bold text-sm">Notices</h3><p class="text-[11px] text-gray-400">3 New</p>
</div>
</div>

<!-- Profile Details -->
<div class="px-4 mt-2">
<div class="bg-white rounded-[20px] p-4 border">
<h3 class="font-bold text-sm mb-3"><i class="fa-regular fa-user mr-2 text-[#4f46e5]"></i>Student Profile (DAMSES Style)</h3>
<div class="space-y-2 text-sm">
<div class="flex justify-between py-2 border-b border-dashed"><span class="text-gray-400 text-xs">Full Name</span><span class="font-semibold">${s.name}</span></div>
<div class="flex justify-between py-2 border-b border-dashed"><span class="text-gray-400 text-xs">Admission No</span><span class="font-semibold">${s.id}</span></div>
<div class="flex justify-between py-2 border-b border-dashed"><span class="text-gray-400 text-xs">Class / Section</span><span class="font-semibold">${s.class} - A</span></div>
<div class="flex justify-between py-2"><span class="text-gray-400 text-xs">Father's Name</span><span class="font-semibold">${s.father}</span></div>
</div>
</div>
</div>

<div class="p-4"><button onclick="feesPage()" class="w-full h-14 bg-[#4f46e5] text-white rounded-[16px] font-bold shadow-lg">Pay Fees Now <i class="fa-solid fa-arrow-right ml-2"></i></button></div>
</div>`;
}

function feesPage(){
const s=cur;
document.getElementById('app').innerHTML=`
<div class="max-w-md mx-auto min-h-screen bg-[#f5f7fb] pb-10">
<div class="bg-white p-4 flex items-center gap-3 border-b sticky top-0 z-10">
<button onclick="studentHome()" class="w-9 h-9 bg-gray-100 rounded-full"><i class="fa-solid fa-arrow-left"></i></button>
<h2 class="font-bold">Fees - ${s.name}</h2>
</div>
<div class="p-4 space-y-3">
<div class="bg-[#4f46e5] text-white rounded-[20px] p-5">
<p class="text-xs opacity-80">Total Payable</p><h1 class="text-3xl font-black" id="totalAmt">₹0</h1><p class="text-[11px] opacity-70 mt-1">${s.id} | ${s.class}</p>
</div>
<div class="bg-white rounded-[20px] p-4 border">
<h3 class="font-bold text-sm mb-3">Select Fees to Pay</h3>
<label class="flex justify-between items-center border-2 border-gray-100 rounded-xl p-3 mb-2 has-[:checked]:border-[#4f46e5] has-[:checked]:bg-[#f5f7ff]"><span class="flex items-center gap-3"><input type="checkbox" value="7500" data-n="Q1 Fees" class="fee w-5 h-5"> Q1 Fees</span><span class="font-bold">₹7500 <span class="text-[10px] bg-yellow-100 px-2 py-1 rounded-full ml-1">Pending</span></span></label>
<label class="flex justify-between items-center border-2 border-gray-100 rounded-xl p-3 mb-2 has-[:checked]:border-[#4f46e5] has-[:checked]:bg-[#f5f7ff]"><span class="flex items-center gap-3"><input type="checkbox" value="7500" data-n="Q2 Fees" class="fee w-5 h-5"> Q2 Fees</span><span class="font-bold">₹7500 <span class="text-[10px] bg-yellow-100 px-2 py-1 rounded-full ml-1">Pending</span></span></label>
<label class="flex justify-between items-center border-2 border-gray-100 rounded-xl p-3 mb-2 has-[:checked]:border-[#4f46e5] has-[:checked]:bg-[#f5f7ff]"><span class="flex items-center gap-3"><input type="checkbox" value="500" data-n="Activity Fees" class="fee w-5 h-5"> Activity</span><span class="font-bold">₹500</span></label>
<label class="flex justify-between items-center border-2 border-gray-100 rounded-xl p-3 mb-2 has-[:checked]:border-[#4f46e5] has-[:checked]:bg-[#f5f7ff]"><span class="flex items-center gap-3"><input type="checkbox" value="100" data-n="Bonafide" class="fee w-5 h-5"> Bonafide Cert</span><span class="font-bold">₹100</span></label>
</div>
<button id="payBtn" disabled onclick="doPay()" class="w-full h-14 bg-[#4f46e5] disabled:opacity-40 text-white rounded-[16px] font-black text-lg">Pay ₹0 <i class="fa-solid fa-lock ml-2"></i></button>
<p class="text-[10px] text-center text-gray-400 mt-2">Secure by Razorpay | UPI, QR, Card, Netbanking, Wallet</p>
</div>
</div>`;
document.querySelectorAll('.fee').forEach(c=>c.addEventListener('change', calcFees));
}

function calcFees(){
 let t=0; document.querySelectorAll('.fee:checked').forEach(c=>t+=parseInt(c.value));
 document.getElementById('totalAmt').innerText='₹'+t;
 const b=document.getElementById('payBtn');
 b.innerHTML=t>0?`Pay ₹${t} <i class="fa-solid fa-arrow-right ml-2"></i>`:`Pay ₹0 <i class="fa-solid fa-lock ml-2"></i>`;
 b.disabled=t==0;
}

function doPay(){
 let t=0, names=[]; document.querySelectorAll('.fee:checked').forEach(c=>{t+=parseInt(c.value); names.push(c.dataset.n);});
 if(t==0) return;
 if(typeof Razorpay==='undefined'){ alert('Razorpay load nahi hua, page reload karo'); return; }
 var opt={key:RAZOR_KEY, amount:t*100, currency:"INR", name:"SEF Dahod", description:names.join(', ')+" - "+cur.name+" ("+cur.id+")",
 handler:function(r){ alert("✅ Payment Success!\nID: "+r.razorpay_payment_id+"\n"+cur.name+" ka "+names.join(', ')+" paid!"); studentHome(); },
 prefill:{name:cur.father||cur.name, contact:cur.mobile||"9723675167"}, theme:{color:"#4f46e5"}};
 new Razorpay(opt).open();
}

// ADMIN PAGE WITH EDIT/DELETE
function adminPage(){
 STUDENTS=loadStudents();
 document.getElementById('app').innerHTML=`
 <div class="min-h-screen bg-[#f5f7fb] p-4">
 <div class="max-w-5xl mx-auto">
 <div class="bg-white rounded-[20px] p-5 flex justify-between items-center border shadow-sm">
 <div><h1 class="font-black text-xl">Admin Panel</h1><p class="text-xs text-gray-500">${STUDENTS.length} Students | Edit/Delete Available</p></div>
 <div class="flex gap-2"><button onclick="openAddModal()" class="bg-[#4f46e5] text-white px-4 py-2 rounded-xl text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i> Add Student</button><button onclick="loginPage()" class="bg-gray-100 px-4 py-2 rounded-xl text-sm">Logout</button></div>
 </div>
 <div class="mt-4 bg-white rounded-[20px] border overflow-hidden">
 <div class="p-4 flex gap-2"><input id="search" oninput="filterAdmin()" placeholder="Search by Name / Admission No" class="flex-1 h-10 border rounded-xl px-4"><button onclick="resetData()" class="text-xs bg-red-50 text-red-600 px-3 rounded-xl">Reset</button></div>
 <div class="overflow-auto max-h-[70vh]">
 <table class="w-full text-sm">
 <thead class="bg-gray-50 sticky top-0"><tr><th class="p-3 text-left">ID</th><th class="p-3 text-left">Name</th><th class="p-3 text-left">Class</th><th class="p-3 text-left">Father</th><th class="p-3 text-left">Mobile</th><th class="p-3 text-right">Action</th></tr></thead>
 <tbody id="adminBody"></tbody>
 </table>
 </div>
 </div>
 </div>
 </div>
 <!-- Edit Modal -->
 <div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
 <div class="bg-white rounded-[20px] p-6 w-full max-w-sm">
 <h3 class="font-bold mb-4" id="modalTitle">Edit Student</h3>
 <input id="e_id" placeholder="Admission No" class="w-full h-11 border rounded-xl px-3 mb-2">
 <input id="e_name" placeholder="Student Name" class="w-full h-11 border rounded-xl px-3 mb-2">
 <input id="e_class" placeholder="Class" class="w-full h-11 border rounded-xl px-3 mb-2">
 <input id="e_father" placeholder="Father Name" class="w-full h-11 border rounded-xl px-3 mb-2">
 <input id="e_mobile" placeholder="Mobile" class="w-full h-11 border rounded-xl px-3 mb-2">
 <input id="e_fees" placeholder="Annual Fees" type="number" class="w-full h-11 border rounded-xl px-3 mb-3">
 <div class="flex gap-2"><button onclick="saveEdit()" class="flex-1 h-11 bg-[#4f46e5] text-white rounded-xl font-bold">Save</button><button onclick="closeModal()" class="flex-1 h-11 bg-gray-100 rounded-xl">Cancel</button></div>
 </div>
 </div>
 `;
 renderAdmin();
}

let editIndex=-1;
function renderAdmin(){
 const body=document.getElementById('adminBody');
 const q=(document.getElementById('search')?.value||"").toLowerCase();
 body.innerHTML="";
 STUDENTS.forEach((s,i)=>{
   if(q && !(s.id.includes(q) || s.name.toLowerCase().includes(q))) return;
   body.innerHTML+=`<tr class="border-b hover:bg-gray-50"><td class="p-3 font-bold">${s.id}</td><td class="p-3">${s.name}</td><td class="p-3">${s.class}</td><td class="p-3">${s.father}</td><td class="p-3">${s.mobile}</td>
   <td class="p-3 text-right flex justify-end gap-1">
   <button onclick="openEdit(${i})" class="w-8 h-8 bg-blue-50 text-blue-600 rounded-full"><i class="fa-solid fa-pen text-xs"></i></button>
   <button onclick="deleteStudent(${i})" class="w-8 h-8 bg-red-50 text-red-600 rounded-full"><i class="fa-solid fa-trash text-xs"></i></button>
   </td></tr>`;
 });
}
function filterAdmin(){ renderAdmin(); }
function openAddModal(){ editIndex=-1; document.getElementById('modalTitle').innerText='Add Student'; ['e_id','e_name','e_class','e_father','e_mobile','e_fees'].forEach(id=>document.getElementById(id).value=''); document.getElementById('editModal').classList.remove('hidden'); document.getElementById('editModal').classList.add('flex'); }
function openEdit(i){
 editIndex=i; const s=STUDENTS[i]; document.getElementById('modalTitle').innerText='Edit - '+s.name;
 document.getElementById('e_id').value=s.id; document.getElementById('e_name').value=s.name; document.getElementById('e_class').value=s.class; document.getElementById('e_father').value=s.father; document.getElementById('e_mobile').value=s.mobile; document.getElementById('e_fees').value=s.fees;
 document.getElementById('editModal').classList.remove('hidden'); document.getElementById('editModal').classList.add('flex');
}
function closeModal(){ document.getElementById('editModal').classList.add('hidden'); document.getElementById('editModal').classList.remove('flex'); }
function saveEdit(){
 const obj={id:document.getElementById('e_id').value.trim(), name:document.getElementById('e_name').value.trim(), class:document.getElementById('e_class').value.trim(), father:document.getElementById('e_father').value.trim(), mobile:document.getElementById('e_mobile').value.trim(), fees:parseInt(document.getElementById('e_fees').value)||30000, photo:(document.getElementById('e_name').value.trim()[0]||'S').toUpperCase()};
 if(!obj.id || !obj.name){ alert('ID and Name required'); return; }
 if(editIndex>=0) STUDENTS[editIndex]=obj; else STUDENTS.push(obj);
 saveStudents(STUDENTS); closeModal(); renderAdmin();
}
function deleteStudent(i){
 if(!confirm("Delete "+STUDENTS[i].name+" ("+STUDENTS[i].id+")?")) return;
 STUDENTS.splice(i,1); saveStudents(STUDENTS); renderAdmin();
}
function resetData(){ if(!confirm("Reset to default 5 students?")) return; localStorage.removeItem('sef_students_v2'); STUDENTS=loadStudents(); renderAdmin(); }

loginPage();
</script>
</body>
</html>
