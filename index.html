function doLogin(){
const u=(document.getElementById('uid').value||'').trim(); const p=(document.getElementById('pwd').value||'').trim();
if(!u||!p){loginPage('ID Password bharo'); return;}
const uL=u.toLowerCase(); const pL=p.toLowerCase();
if(uL==='admin'&&pL==='admin'){cur={id:'ADMIN',name:'Admin',role:'admin'}; adminDashboard(); return;}
const t=TEACHERS_DATA.find(x=>x.id.toLowerCase()===uL);
if(t){cur={...t, role:'teacher'}; teacherDashboard(); return;}
const s=STUDENTS.find(x=>x.id.toLowerCase()===uL);
if(!s){loginPage('ID nahi mila'); return;}
if(s.id.toLowerCase()!==pL){loginPage('Password = Admission No'); return;}
cur={...s, role:'student'}; studentDashboard();
}

function addStudent(){const id=prompt('Admission No:'); if(!id) return; const name=prompt('Name:'); if(!name) return; const cls=prompt('Class:'); const mob=prompt('Mobile:'); STUDENTS.push({id, name, class:cls||'8th', father:'', mobile:mob||''}); setLS('sef_final_students_v83', STUDENTS); adminTab('students');}
function editStudent(id){const s=STUDENTS.find(x=>x.id===id); if(!s) return; const n=prompt('Name:', s.name); if(n!==null) s.name=n; const c=prompt('Class:', s.class); if(c!==null) s.class=c; setLS('sef_final_students_v83', STUDENTS); adminTab('students');}
function deleteStudent(id){if(!confirm('Delete '+id+'?')) return; STUDENTS=STUDENTS.filter(x=>x.id!==id); setLS('sef_final_students_v83', STUDENTS); adminTab('students');}
function addTeacher(){const id=prompt('Teacher ID:'); if(!id) return; const name=prompt('Name:'); if(!name) return; TEACHERS_DATA.push({id, name, subject:'General', mobile:'', password:id}); adminTab('teachers');}
function editTeacher(id){const t=TEACHERS_DATA.find(x=>x.id===id); if(!t) return; const n=prompt('Name:', t.name); if(n!==null) t.name=n; adminTab('teachers');}
function deleteTeacher(id){if(!confirm('Delete '+id+'?')) return; const i=TEACHERS_DATA.findIndex(x=>x.id===id); if(i>=0) TEACHERS_DATA.splice(i,1); adminTab('teachers');}
function adminTogglePaid(id,q){let paid=getLS('sef_paid_fees_'+id,[]); if(paid.includes(q)){paid=paid.filter(x=>x!==q);}else{paid.push(q); let all=getLS('sef_fees_collection',[]); all.push({id:Date.now(), studentId:id, studentName:(STUDENTS.find(s=>s.id===id)||{}).name||'', studentClass:(STUDENTS.find(s=>s.id===id)||{}).class||'', amount:7500, feesNames:q, paymentId:'ADMIN-'+Date.now(), date:new Date().toLocaleString(), status:'Paid by Admin'}); setLS('sef_fees_collection',all);} setLS('sef_paid_fees_'+id,paid); adminTab('students');}
function adminTab(tab){
document.querySelectorAll('[id^="tab-"]').forEach(b=>b.className="bg-gray-100 px-4 py-2 rounded-full text-sm");
const a=document.getElementById('tab-'+tab); if(a) a.className="bg-[#1e3442] text-white px-4 py-2 rounded-full font-bold";

if(tab==='students'){
c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><div class="flex justify-between items-center"><h3 class="font-bold">Students - `+STUDENTS.length+` | Q Click → Student Lock | + Add | Edit/Delete</h3><button onclick="addStudent()" class="bg-[#1e3442] text-white px-4 py-2 rounded-full text-sm">+ Add Student</button></div><div class="overflow-auto mt-4"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-2 text-left">ID</th><th class="p-2 text-left">Name</th><th class="p-2">Class</th><th class="p-2">Q1</th><th class="p-2">Q2</th><th class="p-2">Q3</th><th class="p-2">Q4</th><th class="p-2">Action</th></tr></thead><tbody>`+STUDENTS.map(s=>{const paid=getLS('sef_paid_fees_'+s.id,[]); function btn(q){const is=paid.includes(q); return `<button onclick="adminTogglePaid('${s.id}','${q}')" class="${is?'bg-green-600 text-white':'bg-gray-100'} px-2 py-1 rounded-full text-[11px] font-bold">${is?'✅ '+q:'☐ '+q}</button>`;} return `<tr class="border-b"><td class="p-2 font-bold">${s.id}</td><td class="p-2">${s.name}</td><td class="p-2">${s.class}</td><td class="p-2">${btn('Q1 Fees')}</td><td class="p-2">${btn('Q2 Fees')}</td><td class="p-2">${btn('Q3 Fees')}</td><td class="p-2">${btn('Q4 Fees')}</td><td class="p-2 flex gap-1"><button onclick="editStudent('${s.id}')" class="w-7 h-7 bg-blue-50 text-blue-600 rounded-full">✏️</button><button onclick="deleteStudent('${s.id}')" class="w-7 h-7 bg-red-50 text-red-600 rounded-full">🗑️</button></td></tr>`;}).join('')+`</tbody></table></div></div>`;

}
if(tab==='teachers'){
c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><div class="flex justify-between"><h3 class="font-bold">Teachers - `+TEACHERS_DATA.length+`</h3><button onclick="addTeacher()" class="bg-[#1e3442] text-white px-4 py-2 rounded-full text-sm">+ Add Teacher</button></div><div class="mt-4">`+TEACHERS_DATA.map(t=>`<div class="border p-3 rounded-xl flex justify-between mb-2"><span>${t.id} - ${t.name} (${t.subject})</span><span><button onclick="editTeacher('${t.id}')" class="text-blue-600 mr-2">Edit</button><button onclick="deleteTeacher('${t.id}')" class="text-red-600">Delete</button></span></div>`).join('')+`</div></div>`;

if(tab==='fees'){
const all=getLS('sef_fees_collection', []); const total=all.reduce((s,f)=>s+(f.amount||0),0);
c.innerHTML=`<div class="space-y-4"><div class="bg-green-600 text-white rounded-[20px] p-5"><h2 class="text-3xl font-black">₹`+total+`</h2><p>`+all.length+` Payments - Fees Modify: Q Click se Paid/Unpaid</p></div><div class="bg-white rounded-[20px] border p-4 overflow-auto"><table class="w-full text-sm"><thead><tr><th>Date</th><th>ID</th><th>Name</th><th>Fees</th><th>Amount</th></tr></thead><tbody>`+(all.map(f=>`<tr class="border-b"><td class="text-[11px]">`+f.date+`</td><td>`+f.studentId+`</td><td>`+f.studentName+`</td><td>`+f.feesNames+`</td><td>₹`+f.amount+`</td></tr>`).join('')||'<tr><td colspan="5" class="p-8 text-center">No fees</td></tr>')+`</tbody></table></div></div>`;
return;
}
if(tab==='announce'){
const list=getLS('sef_announce', []);
c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><h3 class="font-bold mb-3">Announcement - Notice/Event/Competition/Holiday - Date Wise</h3><div class="grid grid-cols-4 gap-2 mb-4"><input id="annTitle" placeholder="Title" class="border rounded-xl px-3 h-11"><select id="annType" class="border rounded-xl px-3 h-11"><option>Notice</option><option>Event</option><option>Competition</option><option>Holiday</option></select><input id="annDate" type="date" class="border rounded-xl px-3 h-11"><button onclick="addAnn()" class="bg-[#1e3442] text-white px-4 rounded-xl">Add</button></div><div class="space-y-2">`+list.map((a,i)=>`<div class="border rounded-xl p-3 flex justify-between"><div><p class="font-bold">`+a.title+` <span class="text-[10px] bg-gray-100 px-2 py-0.5 rounded-full">`+a.type+`</span></p><p class="text-xs">`+a.date+`</p></div><button onclick="delAnn(`+i+`)" class="text-red-500">Delete</button></div>`).join('')+`</div></div>`;
return;
}
if(tab==='attendance'){
const list=STUDENTS.slice(0,10);
c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><h3 class="font-bold mb-3">Attendance - Total Present / Absent / Holiday - Graph</h3><div class="flex gap-2 mb-4"><input id="attDate" type="date" class="border rounded-xl px-3 h-11"><button onclick="saveAtt()" class="bg-[#1e3442] text-white px-4 rounded-xl">Save Attendance</button></div><div class="overflow-auto"><table class="w-full text-sm"><thead><tr><th>ID</th><th>Name</th><th>Present</th><th>Absent</th><th>Holiday</th></tr></thead><tbody>`+list.map(s=>{const at=getLS('sef_att_'+s.id, {present:165, absent:5, holiday:10}); return `<tr class="border-b"><td>${s.id}</td><td>${s.name}</td><td><input id="p_${s.id}" value="${at.present}" class="border w-16 rounded px-2"></td><td><input id="a_${s.id}" value="${at.absent}" class="border w-16 rounded px-2"></td><td><input id="h_${s.id}" value="${at.holiday}" class="border w-16 rounded px-2"></td></tr>`;}).join('')+`</tbody></table></div><div class="mt-4 bg-gray-50 p-4 rounded-xl"><p class="font-bold">Attendance Graph Preview</p><div class="flex gap-2 mt-2"><div class="bg-green-500 h-6" style="width:70%">Present 165</div><div class="bg-red-500 h-6" style="width:10%">Absent 5</div><div class="bg-orange-400 h-6" style="width:20%">Holiday 10</div></div></div></div>`;
return;
}
if(tab==='homework'){
const list=getLS('sef_homework', []);
c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><h3 class="font-bold mb-3">Homework - Date Wise</h3><div class="grid grid-cols-5 gap-2 mb-4"><input id="hwTitle" placeholder="Title" class="border rounded-xl px-3 h-11"><input id="hwClass" placeholder="Class" class="border rounded-xl px-3 h-11"><input id="hwFrom" type="date" class="border rounded-xl px-3 h-11"><input id="hwTo" type="date" class="border rounded-xl px-3 h-11"><button onclick="addHW()" class="bg-[#1e3442] text-white px-4 rounded-xl">Add</button></div><div class="space-y-2">`+list.map((h,i)=>`<div class="border rounded-xl p-3 flex justify-between"><p>`+h.title+` - `+h.class+` (`+h.from+` to `+h.to+`)</p><button onclick="delHW(`+i+`)" class="text-red-500">Delete</button></div>`).join('')+`</div></div>`;
return;
}
c.innerHTML=`<div class="bg-white rounded-[20px] border p-8 text-center"><p class="font-bold">`+tab+` Module - Admin Modify</p></div>`;
}
function addAnn(){const t=document.getElementById('annTitle').value; const ty=document.getElementById('annType').value; const d=document.getElementById('annDate').value; if(!t) return; const l=getLS('sef_announce',[]); l.unshift({title:t, type:ty, date:d}); setLS('sef_announce',l); adminTab('announce');}
function delAnn(i){const l=getLS('sef_announce',[]); l.splice(i,1); setLS('sef_announce',l); adminTab('announce');}
function saveAtt(){STUDENTS.slice(0,10).forEach(s=>{const p=document.getElementById('p_'+s.id)?.value; const a=document.getElementById('a_'+s.id)?.value; const h=document.getElementById('h_'+s.id)?.value; setLS('sef_att_'+s.id, {present:parseInt(p)||0, absent:parseInt(a)||0, holiday:parseInt(h)||0});}); alert('Attendance Saved!');}
function addHW(){const t=document.getElementById('hwTitle').value; const cl=document.getElementById('hwClass').value; const f=document.getElementById('hwFrom').value; const to=document.getElementById('hwTo').value; if(!t) return; const l=getLS('sef_homework',[]); l.unshift({title:t, class:cl||'All', from:f, to:to}); setLS('sef_homework',l); adminTab('homework');}
function delHW(i){const l=getLS('sef_homework',[]); l.splice(i,1); setLS('sef_homework',l); adminTab('homework');}
function openFees(){const paid=getLS('sef_paid_fees_'+cur.id,[]); document.getElementById('app').innerHTML=`<div class="max-w-md mx-auto min-h-screen bg-[#f6f7fb]"><div class="bg-white p-4 flex items-center gap-3 border-b"><button onclick="studentDashboard()" class="w-9 h-9 bg-gray-100 rounded-full">←</button><h2 class="font-bold">Fees - `+cur.name+`</h2></div><div class="p-4">`+['Q1 Fees','Q2 Fees','Q3 Fees','Q4 Fees'].map(q=>{const is=paid.includes(q); return `<div class="border rounded-xl p-3 flex justify-between mb-2 ${is?'bg-green-50':''}"><span>${q} ${is?'✅ PAID 🔒':''}</span></div>`;}).join('')+`<button onclick="studentDashboard()" class="mt-4 bg-gray-100 px-4 py-2 rounded-full">Back</button></div></div>`;}
function openAttendance(){document.getElementById('app').innerHTML=`<div class="max-w-md mx-auto p-4"><h2 class="font-bold">Attendance</h2><button onclick="studentDashboard()" class="mt-4 bg-gray-100 px-4 py-2 rounded-full">Back</button></div>`;}
function openHomework(){document.getElementById('app').innerHTML=`<div class="max-w-md mx-auto p-4"><h2 class="font-bold">Homework</h2><button onclick="studentDashboard()" class="mt-4 bg-gray-100 px-4 py-2 rounded-full">Back</button></div>`;}
function openAnnounce(){const list=getLS('sef_announce',[]); document.getElementById('app').innerHTML=`<div class="max-w-md mx-auto p-4"><h2 class="font-bold">Notice</h2><div class="mt-4">`+list.map(a=>`<div class="bg-white rounded-xl p-3 border mb-2">`+a.title+` - `+a.type+` - `+a.date+`</div>`).join('')+`</div><button onclick="studentDashboard()" class="mt-4 bg-gray-100 px-4 py-2 rounded-full">Back</button></div>`;}
function openTimetable(){document.getElementById('app').innerHTML=`<div class="max-w-md mx-auto p-4"><h2 class="font-bold">Timetable</h2><button onclick="studentDashboard()" class="mt-4 bg-gray-100 px-4 py-2 rounded-full">Back</button></div>`;}
function openExamTT(){document.getElementById('app').innerHTML=`<div class="max-w-md mx-auto p-4"><h2 class="font-bold">Exam TT</h2><button onclick="studentDashboard()" class="mt-4 bg-gray-100 px-4 py-2 rounded-full">Back</button></div>`;}
window.onload=()=>{loginPage();};
</script></body></html>
