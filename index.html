}

function btn(q){const is=paid.includes(q); return `<button onclick="adminTogglePaid('${s.id}','${q}')" class="${is?'bg-green-600 text-white':'bg-gray-100'} px-2 py-1 rounded-full text-[11px]">${is?'✅ '+q:'☐ '+q}</button>`;}

}).join('')+`</tbody></table></div></div>`;
return;
}

}
}
