}

function adminTogglePaid(id,q){let paid=getLS('sef_paid_fees_'+id,[]); if(paid.includes(q)){paid=paid.filter(x=>x!==q);}else{paid.push(q); let all=getLS('sef_fees_collection',[]); all.push({id:Date.now(), studentId:id, studentName:(STUDENTS.find(s=>s.id===id)||{}).name||'', studentClass:(STUDENTS.find(s=>s.id===id)||{}).class||'', amount:7500, feesNames:q, paymentId:'ADMIN-'+Date.now(), date:new Date().toLocaleString(), status:'Paid by Admin'}); setLS('sef_fees_collection',all);} setLS('sef_paid_fees_'+id,paid); adminTab('students');}

if(tab==='students'){
c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><h3 class="font-bold">Students - `+STUDENTS.length+` | Admin Qtr Click → Student Lock (Requirement)</h3><div class="overflow-auto mt-4"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-2 text-left">ID</th><th class="p-2 text-left">Name</th><th class="p-2">Class</th><th class="p-2">Q1</th><th class="p-2">Q2</th><th class="p-2">Q3</th><th class="p-2">Q4</th></tr></thead><tbody>`+STUDENTS.map(s=>{const paid=getLS('sef_paid_fees_'+s.id,[]); function btn(q){const is=paid.includes(q); return `<button onclick="adminTogglePaid('${s.id}','${q}')" class="${is?'bg-green-600 text-white':'bg-gray-100'} px-2 py-1 rounded-full text-[11px] font-bold">${is?'✅ '+q:'☐ '+q}</button>`;} return `<tr class="border-b"><td class="p-2 font-bold">${s.id}</td><td class="p-2">${s.name}</td><td class="p-2">${s.class}</td><td class="p-2">${btn('Q1 Fees')}</td><td class="p-2">${btn('Q2 Fees')}</td><td class="p-2">${btn('Q3 Fees')}</td><td class="p-2">${btn('Q4 Fees')}</td></tr>`;}).join('')+`</tbody></table></div><p class="text-[11px] text-gray-500 mt-3">Example: 215 ki Q1 Paid click → 215 ke app me Q1 Lock</p></div>`;
return;
}
if(tab==='fees'){
const all=getLS('sef_fees_collection', []); const total=all.reduce((s,f)=>s+(f.amount||0),0);
c.innerHTML=`<div class="space-y-4"><div class="bg-green-600 text-white rounded-[20px] p-5 flex justify-between"><div><p class="text-xs">Total Collected</p><h2 class="text-3xl font-black">₹`+total+`</h2><p class="text-xs">`+all.length+` Payments</p></div><img src="logo.png" class="w-14 h-14 rounded-full bg-white p-1"></div><div class="bg-white rounded-[20px] border p-4 overflow-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-2 text-left">Date</th><th class="p-2">ID</th><th class="p-2 text-left">Name</th><th class="p-2">Fees</th><th class="p-2">Amount</th></tr></thead><tbody>`+(all.map(f=>`<tr class="border-b"><td class="p-2 text-[11px]">`+f.date+`</td><td class="p-2 font-bold">`+f.studentId+`</td><td class="p-2">`+f.studentName+`</td><td class="p-2"><span class="bg-green-100 px-2 py-1 rounded-full">`+f.feesNames+`</span></td><td class="p-2 font-bold text-green-600">₹`+f.amount+`</td></tr>`).join('')||'<tr><td colspan="5" class="p-8 text-center text-gray-400">No fees</td></tr>')+`</tbody></table></div></div>`;

function addAnn(){const t=document.getElementById('annTitle').value; const d=document.getElementById('annDate').value; if(!t) return; const l=getLS('sef_announce',[]); l.unshift({title:t, date:d, desc:''}); setLS('sef_announce',l); adminTab('announce');}
function delAnn(i){const l=getLS('sef_announce',[]); l.splice(i,1); setLS('sef_announce',l); adminTab('announce');}
function addHW(){const t=document.getElementById('hwTitle').value; if(!t) return; const l=getLS('sef_homework',[]); l.unshift({title:t, class:'All'}); setLS('sef_homework',l); adminTab('homework');}
function delHW(i){const l=getLS('sef_homework',[]); l.splice(i,1); setLS('sef_homework',l); adminTab('homework');}
function openFees(){
const s=cur; const paid=getLS('sef_paid_fees_'+s.id,[]);
function row(val,name,label){const is=paid.includes(name); return `<label class="flex justify-between items-center border-2 `+(is?'border-green-200 bg-green-50 opacity-60':'border-gray-100 bg-white')+` rounded-xl p-3 mb-2"><span class="flex items-center gap-2"><input type="checkbox" value="`+val+`" data-n="`+name+`" class="fee w-5 h-5" `+(is?'disabled':'')+`>`+label+` `+(is?'✅ PAID':'')+`</span><span class="font-bold">₹`+val+` `+(is?'🔒':'')+`</span></label>`;}
document.getElementById('app').innerHTML=`
<div class="max-w-md mx-auto min-h-screen bg-[#f6f7fb]"><div class="bg-white p-4 flex items-center gap-3 border-b sticky top-0"><button onclick="studentDashboard()" class="w-9 h-9 bg-gray-100 rounded-full"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-bold">Fees - `+s.name+` (`+s.id+`)</h2><img src="logo.png" class="w-8 h-8 rounded-full ml-auto"></div>
<div class="p-4 space-y-3"><div class="bg-[#4f46e5] text-white rounded-[20px] p-5"><h1 class="text-3xl font-black" id="totalAmt">₹0</h1><p class="text-[11px]">Paid = Lock</p></div><div class="bg-white rounded-[20px] p-4 border">`+row(7500,'Q1 Fees','Q1 Fees')+row(7500,'Q2 Fees','Q2 Fees')+row(7500,'Q3 Fees','Q3 Fees')+row(7500,'Q4 Fees','Q4 Fees')+`</div><button id="payBtn" disabled onclick="doPay()" class="w-full h-14 bg-[#4f46e5] disabled:opacity-40 text-white rounded-[16px] font-black">Pay ₹0</button></div></div>`;
document.querySelectorAll('.fee:not([disabled])').forEach(c=>c.addEventListener('change',()=>{let t=0; document.querySelectorAll('.fee:checked').forEach(x=>t+=parseInt(x.value)); document.getElementById('totalAmt').innerText='₹'+t; document.getElementById('payBtn').innerText=t>0?`Pay ₹`+t:`Pay ₹0`; document.getElementById('payBtn').disabled=t==0;}));
}
function doPay(){
let total=0,names=[]; document.querySelectorAll('.fee:checked').forEach(c=>{total+=parseInt(c.value); names.push(c.dataset.n);});
if(total==0) return;
var opt={key:RAZOR_KEY,amount:total*100,currency:"INR",name:"SEF Dahod",description:names.join(',')+" - "+cur.name, handler:function(r){let all=getLS('sef_fees_collection',[]); all.push({id:Date.now(), studentId:cur.id, studentName:cur.name, studentClass:cur.class, amount:total, feesNames:names.join(', '), paymentId:r.razorpay_payment_id, date:new Date().toLocaleString()}); setLS('sef_fees_collection',all); let paid=getLS('sef_paid_fees_'+cur.id,[]); names.forEach(n=>{if(!paid.includes(n)) paid.push(n);}); setLS('sef_paid_fees_'+cur.id,paid); alert("Paid! "+names.join(',')); openFees();}, prefill:{name:cur.name}, theme:{color:"#4f46e5"}};
new Razorpay(opt).open();
}
