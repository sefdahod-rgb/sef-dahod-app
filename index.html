<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEF Dahod - Rainbow Public School</title>
    
    <!-- Official Razorpay Payment Gateway SDK -->
    <script src="https://razorpay.com"></script>

    <!-- CRITICAL CORE JAVASCRIPT PLACED AT TOP TO BYPASS BROWSER CACHE OVERRIDE -->
    <script>
        var RAZORPAY_KEY_ID = "rzp_test_YOUR_KEY_HERE"; 
        var ADMIN_ID = "admin";
        var ADMIN_PASS = "admin789";
        var loggedInStudentAdmission = "";

        function setupDatabaseEngine() {
            localStorage.setItem('schoolNotice', 'Welcome to Rainbow Public School Mobile Application Portal. New batches start next week.');
            var masterSeedRecord = {
                "52": { 
                    name: "Praveen Bhuriya", 
                    class: "10th IT Course", 
                    pass: "123", 
                    feeStatus: "Pending",
                    attendance: "Not Marked",
                    theory: 78,
                    practical: 18,
                    grade: "A"
                }
            };
            localStorage.setItem('studentDB', JSON.stringify(masterSeedRecord));
        }

        // Initialize instantly before DOM loads
        if (!localStorage.getItem('studentDB') || localStorage.getItem('schoolNotice') === null) {
            setupDatabaseEngine();
        }

        function flushSystemCache() {
            localStorage.clear();
            setupDatabaseEngine();
            alert("System Cache Cleaned Successfully! Try logging in now.");
            window.location.reload();
        }

        function quickLinkBypass(usr, psw) {
            document.getElementById('username').value = usr;
            document.getElementById('password').value = psw;
            executeLogin();
        }

        function executeLogin() {
            var userVal = document.getElementById('username').value.trim();
            var passVal = document.getElementById('password').value.trim();
            var errorDiv = document.getElementById('login-error');
            
            errorDiv.classList.add('hidden');
            errorDiv.innerHTML = "";

            if (userVal === ADMIN_ID && passVal === ADMIN_PASS) {
                document.getElementById('screen-login').classList.add('hidden');
                document.getElementById('screen-admin').classList.remove('hidden');
                document.getElementById('input-notice').value = localStorage.getItem('schoolNotice') || "";
                loadAdminStudentList();
                return;
            }

            var studentDB = {};
            try {
                studentDB = JSON.parse(localStorage.getItem('studentDB')) || {};
            } catch(e) {
                setupDatabaseEngine();
                studentDB = JSON.parse(localStorage.getItem('studentDB')) || {};
            }

            if (studentDB[userVal] && studentDB[userVal].pass === passVal) {
                loggedInStudentAdmission = userVal;
                var student = studentDB[userVal];
                
                document.getElementById('screen-login').classList.add('hidden');
                document.getElementById('screen-student').classList.remove('hidden');
                
                document.getElementById('s-name').innerText = student.name;
                document.getElementById('s-admission').innerText = userVal;
                document.getElementById('s-class').innerText = student.class;
                
                var attSpan = document.getElementById('s-attendance');
                attSpan.innerText = student.attendance || "Not Marked";
                if(student.attendance === "Present") attSpan.className = "attendance-badge att-p";
                else if(student.attendance === "Absent") attSpan.className = "attendance-badge att-a";
                else attSpan.className = "attendance-badge att-n";
                
                document.getElementById('s-m-theory').innerText = student.theory !== undefined ? student.theory : "-";
                document.getElementById('s-m-practical').innerText = student.practical !== undefined ? student.practical : "-";
                document.getElementById('s-m-grade').innerText = student.grade || "-";

                updateFeeUI(student.feeStatus);
                document.getElementById('display-notice').innerText = localStorage.getItem('schoolNotice') || "";
            } else {
                errorDiv.classList.remove('hidden');
                errorDiv.innerHTML = "🚨 Invalid Credentials!";
            }
        }

        function updateFeeUI(status) {
            var feeStatusSpan = document.getElementById('s-fee-status');
            feeStatusSpan.innerText = status;
            if(status === "Paid") {
                feeStatusSpan.className = "status-paid";
                document.getElementById('rzp-button').style.display = "none";
            } else {
                feeStatusSpan.className = "status-pending";
                document.getElementById('rzp-button').style.display = "block";
            }
        }

        function payWithRazorpay() {
            if(RAZORPAY_KEY_ID === "rzp_live_SeDR91zuvNa9fG" || !window.Razorpay) {
                alert("🔑 Sandbox Simulation: Auto Marking Billed Fee as Paid!");
                var activeDB = JSON.parse(localStorage.getItem('studentDB'));
                activeDB[loggedInStudentAdmission].feeStatus = "Paid";
                localStorage.setItem('studentDB', JSON.stringify(activeDB));
                updateFeeUI("Paid");
                return;
            }
            
            var studentDB = JSON.parse(localStorage.getItem('studentDB'));
            var student = studentDB[loggedInStudentAdmission];

            var configurationOptions = {
                "key": RAZORPAY_KEY_ID, 
                "amount": 50000, 
                "currency": "INR",
                "name": "Shubhi Education Foundation",
                "description": "Fee Process Module ID: " + loggedInStudentAdmission,
                "handler": function (transactionResponse){
                    alert("🎉 Success! Reference ID: " + transactionResponse.razorpay_payment_id);
                    var activeDB = JSON.parse(localStorage.getItem('studentDB'));
                    activeDB[loggedInStudentAdmission].feeStatus = "Paid";
                    localStorage.setItem('studentDB', JSON.stringify(activeDB));
                    updateFeeUI("Paid");
                },
                "prefill": { "name": student.name, "email": "sefdahod@gmail.com" },
                "theme": { "color": "#2c5364" }
            };
            var nativeRazorpayInstance = new Razorpay(configurationOptions);
            nativeRazorpayInstance.open();
        }

        function registerNewStudent() {
            var admissionNo = document.getElementById('reg-admission').value.trim();
            var name = document.getElementById('reg-name').value.trim();
            var sClass = document.getElementById('reg-class').value.trim();
            var pass = document.getElementById('reg-pass').value.trim();

            if(!admissionNo || !name || !sClass || !pass) { alert("Please complete all fields!"); return; }
            var studentDB = JSON.parse(localStorage.getItem('studentDB')) || {};
            
            if (studentDB[admissionNo]) { alert("🚨 ID already exists!"); return; }

            studentDB[admissionNo] = { 
                name: name, class: sClass, pass: pass, feeStatus: "Pending",
                attendance: "Not Marked", theory: 0, practical: 0, grade: "F"
            };
            localStorage.setItem('studentDB', JSON.stringify(studentDB));
            alert("Account created successfully!");
            loadAdminStudentList();
            
            document.getElementById('reg-admission').value = ""; document.getElementById('reg-name').value = "";
            document.getElementById('reg-class').value = ""; document.getElementById('reg-pass').value = "";
        }

        function loadAdminStudentList() {
            var studentDB = JSON.parse(localStorage.getItem('studentDB')) || {};
            var container = document.getElementById('admin-student-list');
            container.innerHTML = "";

            for (var admNo in studentDB) {
                var student = studentDB[admNo];
                var div = document.createElement('div');
                div.className = "student-row";
                div.innerHTML = "<p><strong>Admission Key:</strong> " + admNo + " | <strong>Name:</strong> " + student.name + "</p>" +
                                "<p><strong>Stream:</strong> " + student.class + " | <strong>Financials:</strong> " + student.feeStatus + "</p>" +
                                "<p><strong>Attendance:</strong> " + (student.attendance || "Not Marked") + "</p>" +
                                "<div class='action-grid'>" +
                                "<button style='background:#16a34a;' onclick=\"setAttendance('" + admNo + "', 'Present')\">Mark Present</button>" +
                                "<button style='background:#dc2626;' onclick=\"setAttendance('" + admNo + "', 'Absent')\">Mark Absent</button>" +
                                "<button style='background:#ea580c;' onclick=\"toggleFeeStatus('" + admNo + "')\">Toggle Fees</button>" +
                                "<button style='background:#4f46e5;' onclick=\"promptUpdateMarks('" + admNo + "')\">Inject Scores</button>" +
                                "<button class='btn-delete' onclick=\"deleteStudent('" + admNo + "')\">Purge Record</button>" +
                                "</div>";
                container.appendChild(div);
            }
        }

        function setAttendance(admNo, state) {
            var studentDB = JSON.parse(localStorage.getItem('studentDB'));
