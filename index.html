if(a==='admin' && p==='admin'){ currentStudent={student_name:'ADMIN', admission_no:'ADMIN'}; renderAdmin(); return; }
const s = STUDENTS.find(x=>x.admission_no==a);
if(!s || a!=p){ alert('Invalid Admission No / Password'); return; }
currentStudent=s; renderParent();
}

function renderParent(){
const s = currentStudent;
const quarters = [
{name:'Q1 (Apr-Jun)', amt: Math.round(s.annual_fees/4), key:'Q1'},
{name:'Q2 (Jul-Sep)', amt: Math.round(s.annual_fees/4), key:'Q2'},
{name:'Q3 (Oct-Dec)', amt: Math.round(s.annual_fees/4), key:'Q3'},
{name:'Q4 (Jan-Mar)', amt: Math.round(s.annual_fees/4), key:'Q4'},
{name:'Bonafide Certificate', amt: 100, key:'BONAFIDE'},
{name:'Activity Fees', amt: 500, key:'ACTIVITY'}
];
document.getElementById('app').innerHTML = `
<div class="max-w-[720px] mx-auto p-4">
<div class="bg-white rounded-[20px] p-6 shadow-sm border">
<div class="flex justify-between">
<div><h2 class="text-xl font-bold">${s.student_name}</h2><p class="text-sm text-gray-500">Adm: ${s.admission_no} | Class: ${s.class} | Father: ${s.father_name}</p><p class="text-xs mt-1">Mobile: ${s.mobile} | RTE: ${s.rte || 'No'}</p></div>
<button onclick="renderLogin()" class="h-9 px-4 rounded-full bg-gray-100 text-sm">Logout</button>
</div>
</div>

<div class="mt-4 bg-white rounded-[20px] p-6 shadow-sm border">
<h3 class="font-bold text-lg mb-1">Pay Now - LIVE Razorpay Checkout</h3>
<p class="text-xs text-green-600 font-bold mb-4">✓ All 5 Payment Methods Enabled: UPI + QR + Card + Netbanking + Wallet</p>
<div class="space-y-3" id="feeList">
${quarters.map((q,i)=>`
<div class="flex items-center justify-between p-4 rounded-xl border hover:border-indigo-300">
<div class="flex items-center gap-3"><input type="checkbox" id="q${i}" value="${q.amt}" data-name="${q.name}" class="w-5 h-5 accent-indigo-600"><label for="q${i}" class="font-semibold">${q.name} - ₹${q.amt}</label></div>
<span class="text-xs px-2 py-1 bg-amber-50 text-amber-700 rounded-full">Pending</span>
</div>`).join('')}
</div>
<div class="mt-6 p-4 bg-gray-50 rounded-xl flex justify-between items-center">
<div><p class="text-sm text-gray-500">Total Selected</p><p class="text-2xl font-extrabold" id="total">₹0</p></div>
<button onclick="payNow()" id="payBtn" class="h-12 px-8 bg-indigo-600 text-white rounded-xl font-bold disabled:opacity-50" disabled>Pay Now - All Methods</button>
</div>
<div class="mt-4 grid grid-cols-5 gap-2 text-[10px] text-center">
<div class="p-2 bg-white border rounded-lg"><div class="text-lg">📱</div>UPI</div>
<div class="p-2 bg-white border rounded-lg"><div class="text-lg">🔳</div>QR Code</div>
<div class="p-2 bg-white border rounded-lg"><div class="text-lg">💳</div>Cards</div>
<div class="p-2 bg-white border rounded-lg"><div class="text-lg">🏦</div>Netbanking</div>
<div class="p-2 bg-white border rounded-lg"><div class="text-lg">👛</div>Wallet</div>
</div>
<p class="text-[11px] text-gray-400 mt-3 text-center">This is only ${s.student_name}'s fee record. No other student's fees visible. Razorpay LIVE key: ${RAZORPAY_KEY} | RTE: ${s.rte || 'No'} • sefdahod.in • Theme #4f46e5</p>
</div>

<div class="mt-4 bg-white rounded-[20px] p-6 shadow-sm border">
<h4 class="font-bold mb-2">LIVE Razorpay Payment Flow</h4>
<p class="text-xs text-gray-600">1. Select fees → Pay Now → Razorpay popup → Choose ANY: UPI App (PhonePe/GPay/Paytm) OR Scan QR OR Card OR Netbanking OR Wallet → Pay → Success receipt auto generated</p>
</div>
</div>
`;
document.querySelectorAll('#feeList input').forEach(cb=>{
cb.addEventListener('change', calcTotal);
});
}

function calcTotal(){
let t=0; cart=[];
document.querySelectorAll('#feeList input:checked').forEach(cb=>{
t+= parseInt(cb.value);
cart.push(cb.dataset.name);
});
document.getElementById('total').innerText='₹'+t;
document.getElementById('payBtn').disabled = t===0;
}

function payNow(){
let total = 0;
document.querySelectorAll('#feeList input:checked').forEach(cb=> total+= parseInt(cb.value));
if(total===0){ alert('Select at least one fee'); return; }

// Create order - client side (for live, server order recommended but this works for all methods)
var options = {
  key: RAZORPAY_KEY,
  amount: total*100,
  currency: "INR",
  name: "SEF Dahod - Rainbow Public School",
  description: cart.join(', ') + " - " + currentStudent.student_name + " (" + currentStudent.admission_no + ")",
  image: "https://cdn.razorpay.com/logos/7K3b6G2K5b5b4g_large.png",
  handler: function (response){
    alert('Payment Success! Payment ID: ' + response.razorpay_payment_id + '\n\n' + currentStudent.student_name + ' ka fees paid ho gaya! Receipt download ho jayega.');
    // Save payment locally
    const payments = JSON.parse(localStorage.getItem('sef_payments')||'[]');
    payments.push({admission_no: currentStudent.admission_no, amount: total, items: cart, payment_id: response.razorpay_payment_id, date: new Date().toISOString()});
    localStorage.setItem('sef_payments', JSON.stringify(payments));
    // Reset
    document.querySelectorAll('#feeList input').forEach(cb=> cb.checked=false);
    calcTotal();
  },
  prefill: {
    name: currentStudent.father_name || currentStudent.student_name,
    contact: currentStudent.mobile || "9723675167",
  },
  notes: {
    admission_no: currentStudent.admission_no,
    student_name: currentStudent.student_name,
    class: currentStudent.class
  },
  theme: { color: "#4f46e5" },
  // Enable ALL methods explicitly
  config: {
    display: {
      blocks: {
        utib: { name: "Pay with UPI", instruments: [{method: "upi"}] },
        other: { name: "Other Methods", instruments: [{method: "card"}, {method: "netbanking"}, {method: "wallet"}] }
      },
      sequence: ["block.utib", "block.other"],
      preferences: { show_default_blocks: true }
    }
  },
  modal: {
    ondismiss: function(){ console.log('checkout closed'); }
  }
};
var rzp = new Razorpay(options);
rzp.on('payment.failed', function (response){
  alert('Payment Failed: ' + response.error.description);
});
rzp.open();
}

function renderAdmin(){
document.getElementById('app').innerHTML = `<div class="p-8"><h1 class="text-2xl font-bold">Admin - 79 Students</h1><p class="mt-4">Total Students: ${STUDENTS.length}</p><button onclick="renderLogin()" class="mt-4 px-4 py-2 bg-gray-200 rounded">Logout</button><div class="mt-4 max-h-[600px] overflow-auto bg-white rounded border p-2 text-xs"><pre>${JSON.stringify(STUDENTS.slice(0,5), null, 2)} ... and ${STUDENTS.length-5} more</pre></div></div>`;
}

renderLogin();
</script>
</body>
</html>
