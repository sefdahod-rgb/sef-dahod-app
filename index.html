function doLogin(){
  const u=document.getElementById('uid').value.trim();
  const p=document.getElementById('pwd').value.trim();
  if(u.toLowerCase()=='admin' && p.toLowerCase()=='admin'){ cur={id:'ADMIN',name:'Admin',class:'All'}; adminDashboard(); return; }
  const s=STUDENTS.find(x=>x.id==u);
  if(!s){ loginPage(`ID ${u} nahi mila! 52,69,109 try karo`); return; }
  if(u!=p){ loginPage("Password = Admission No"); return; }
  cur=s; studentDashboard();
}

        <label class="flex justify-between items-center border-2 border-gray-100 rounded-xl p-3 mb-2"><span class="flex items-center gap-2"><input type="checkbox" value="7500" data-n="Q2 Fees" class="fee w-5 h-5"> Q2 Fees</span><span class="font-bold">₹7500</span></label>
        <label class="flex justify-between items-center border-2 border-gray-100 rounded-xl p-3 mb-2"><span class="flex items-center gap-2"><input type="checkbox" value="7500" data-n="Q3 Fees" class="fee w-5 h-5"> Q3 Fees</span><span class="font-bold">₹7500</span></label>
        <label class="flex justify-between items-center border-2 border-gray-100 rounded-xl p-3 mb-2"><span class="flex items-center gap-2"><input type="checkbox" value="7500" data-n="Q4 Fees" class="fee w-5 h-5"> Q4 Fees</span><span class="font-bold">₹7500</span></label>
        <label class="flex justify-between items-center border-2 border-gray-100 rounded-xl p-3 mb-2"><span class="flex items-center gap-2"><input type="checkbox" value="500" data-n="Activity" class="fee w-5 h-5"> Activity</span><span class="font-bold">₹500</span></label>
      </div>
      <button id="payBtn" disabled onclick="doPay()" class="w-full h-14 bg-[#4f46e5] disabled:opacity-40 text-white rounded-[16px] font-black">Pay ₹0</button>
      <div id="debug" class="text-[11px] bg-yellow-50 border p-2 rounded-xl hidden"></div>
    </div>
  </div>`;
  document.querySelectorAll('.fee').forEach(c=>c.addEventListener('change',()=>{
    let t=0; document.querySelectorAll('.fee:checked').forEach(x=>t+=parseInt(x.value));
    document.getElementById('totalAmt').innerText='₹'+t;
    document.getElementById('payBtn').innerText=t>0?`Pay ₹${t} LIVE`:`Pay ₹0`;
    document.getElementById('payBtn').disabled=t==0;
  }));
}
function doPay(){
  let total=0,names=[]; document.querySelectorAll('.fee:checked').forEach(c=>{total+=parseInt(c.value); names.push(c.dataset.n);});
  if(total==0) return;
  var opt={key:RAZOR_KEY,amount:total*100,currency:"INR",name:"SEF Dahod",description:names.join(',')+" - "+cur.name+" ("+cur.id+")",
    handler:function(r){ alert("✅ Payment Success!\n"+cur.name+"\n₹"+total+"\nID: "+r.razorpay_payment_id); studentDashboard(); },
    prefill:{name:cur.father,contact:cur.mobile}, theme:{color:"#4f46e5"}};
  new Razorpay(opt).open();
}

function openAttendance(){
  const s=cur; const att=ATTENDANCE[s.id];
  document.getElementById('app').innerHTML=`
  <div class="max-w-md mx-auto min-h-screen bg-[#f6f7fb]"><div class="bg-white p-4 flex items-center gap-3 border-b sticky top-0"><button onclick="studentDashboard()" class="w-9 h-9 bg-gray-100 rounded-full"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-bold">Attendance - ${s.name}</h2></div>
  <div class="p-4 space-y-4">
    <div class="grid grid-cols-3 gap-2"><div class="bg-white rounded-2xl p-4 text-center border"><p class="text-[10px] text-gray-400">PRESENT</p><p class="text-2xl font-black text-green-600">${att.present}</p></div><div class="bg-white rounded-2xl p-4 text-center border"><p class="text-[10px] text-gray-400">ABSENT</p><p class="text-2xl font-black text-red-600">${att.absent}</p></div><div class="bg-white rounded-2xl p-4 text-center border"><p class="text-[10px] text-gray-400">HOLIDAY</p><p class="text-2xl font-black text-orange-500">${att.holiday}</p></div></div>
    <div class="bg-white rounded-[20px] p-4 border"><h3 class="font-bold text-sm mb-2">Attendance Graph</h3><canvas id="attChart" height="200"></canvas></div>
    <div class="bg-white rounded-[20px] p-4 border"><h3 class="font-bold text-sm mb-2">Recent History (Date wise)</h3>${att.history.map(h=>`<div class="flex justify-between py-2 border-b text-sm"><span>${h.date}</span><span class="px-2 py-1 rounded-full text-xs ${h.status=='present'?'bg-green-100 text-green-700':h.status=='absent'?'bg-red-100 text-red-700':'bg-orange-100 text-orange-700'}">${h.status.toUpperCase()}</span></div>`).join('')}</div>
  </div></div>`;
  setTimeout(()=>{
    const ctx=document.getElementById('attChart');
    if(!ctx) return;
    new Chart(ctx,{type:'doughnut',data:{labels:['Present','Absent','Holiday'],datasets:[{data:[att.present,att.absent,att.holiday],backgroundColor:['#16a34a','#dc2626','#f97316']}]},options:{plugins:{legend:{position:'bottom'}}}});
  },100);
}

  <div class="bg-white rounded-[20px] border p-4">
    <div class="flex justify-between mb-4"><h3 class="font-bold">Exam Timetable - Date Wise</h3><button onclick="openExamModal(-1)" class="bg-[#4f46e5] text-white px-4 py-2 rounded-xl text-sm font-bold">+ Add Exam</button></div>
    <div class="space-y-2">${EXAMTT.map((e,i)=>`<div class="flex justify-between border rounded-xl p-3"><div><span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-1 rounded-full">${e.class} | ${e.exam}</span><p class="font-bold text-sm mt-1">${e.subject} - ${e.date} | ${e.time}</p></div><div class="flex gap-1"><button onclick="openExamModal(${i})" class="w-8 h-8 bg-blue-50 text-blue-600 rounded-full"><i class="fa-solid fa-pen text-xs"></i></button><button onclick="delExam(${i})" class="w-8 h-8 bg-red-50 text-red-600 rounded-full"><i class="fa-solid fa-trash text-xs"></i></button></div></div>`).join('')}</div>
  </div>`;
}
function openExamModal(i){
  const e=i>=0?EXAMTT[i]:{class:'8th',exam:'First Term',subject:'Maths',date:new Date().toISOString().split('T')[0],time:'10:00 AM - 12:30 PM'};
  document.getElementById('modalInner').innerHTML=`
    <h3 class="font-bold mb-4">${i>=0?'Edit':'Add'} Exam Timetable</h3>
    <div class="grid grid-cols-2 gap-2"><input id="ex_class" value="${e.class}" placeholder="Class" class="h-11 border rounded-xl px-3"><input id="ex_exam" value="${e.exam}" placeholder="Exam Name" class="h-11 border rounded-xl px-3"></div>
    <input id="ex_sub" value="${e.subject}" placeholder="Subject" class="w-full h-11 border rounded-xl px-3 mt-2">
    <div class="grid grid-cols-2 gap-2 mt-2"><input id="ex_date" type="date" value="${e.date}" class="h-11 border rounded-xl px-3"><input id="ex_time" value="${e.time}" placeholder="Time" class="h-11 border rounded-xl px-3"></div>
    <div class="flex gap-2 mt-4"><button onclick="saveExam(${i})" class="flex-1 h-11 bg-[#4f46e5] text-white rounded-xl font-bold">Save</button><button onclick="closeModal()" class="flex-1 h-11 bg-gray-100 rounded-xl">Cancel</button></div>`;
  document.getElementById('adminModal').classList.remove('hidden'); document.getElementById('adminModal').classList.add('flex');
}
function saveExam(i){ const obj={id:i>=0?EXAMTT[i].id:Date.now(), class:document.getElementById('ex_class').value, exam:document.getElementById('ex_exam').value, subject:document.getElementById('ex_sub').value, date:document.getElementById('ex_date').value, time:document.getElementById('ex_time').value}; if(!obj.subject) return alert('Subject'); if(i>=0) EXAMTT[i]=obj; else EXAMTT.push(obj); setLS('sef_examtt',EXAMTT); closeModal(); renderAdminExam(); }
function delExam(i){ if(!confirm('Delete?')) return; EXAMTT.splice(i,1); setLS('sef_examtt',EXAMTT); renderAdminExam(); }

function closeModal(){ document.getElementById('adminModal').classList.add('hidden'); document.getElementById('adminModal').classList.remove('flex'); }

loginPage();
</script>
</body>
</html>
