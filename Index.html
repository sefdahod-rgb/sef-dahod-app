function teacherMarks(){document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-4"><h3 class="font-bold">✍ Marks Entry - Admission No Select + Theory & Practical Feed</h3><div class="mt-4 bg-white p-4 border rounded-xl grid grid-cols-4 gap-2"><input id="mId" placeholder="Admission No" class="border rounded px-3 h-11"><input id="mTh" placeholder="Theory /80" class="border rounded px-3 h-11"><input id="mPr" placeholder="Practical /20" class="border rounded px-3 h-11"><button onclick="saveMarks()" class="bg-[#1e3442] text-white rounded">Save</button></div></div>`;}
function saveMarks(){const id=document.getElementById('mId').value; const th=parseInt(document.getElementById('mTh').value)||0; const pr=parseInt(document.getElementById('mPr').value)||0; const tot=th+pr; let g='C'; if(tot>=80) g='A'; else if(tot>=60) g='B'; setLS('sef_marks_'+id,{theory:th,practical:pr,grade:g}); alert('Saved '+id+' Grade '+g);}
function teacherHomework(){document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-4"><h3 class="font-bold">📚 Homework Upload - PDF Notes</h3><div class="mt-4 bg-white p-4 border rounded-xl"><input id="hwTitle" placeholder="Title" class="border rounded px-3 h-11 w-full mb-2"><input id="hwClass" placeholder="Class" class="border rounded px-3 h-11 w-full mb-2"><input type="file" class="border rounded px-3 h-11 w-full mb-2"><button onclick="uploadHW()" class="bg-[#1e3442] text-white px-4 py-2 rounded">Upload</button></div></div>`;}
function uploadHW(){const t=document.getElementById('hwTitle').value; const c=document.getElementById('hwClass').value||'All'; const l=getLS('sef_homework',[]); l.unshift({title:t,class:c,from:new Date().toLocaleDateString(),to:new Date().toLocaleDateString()}); setLS('sef_homework',l); alert('Homework Uploaded');}
function teacherPT(){document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-4"><h3 class="font-bold">💬 Parent-Teacher Communication - Complaint / Progress Message to Parent</h3><div class="mt-4 bg-white p-4 border rounded-xl"><input id="ptId" placeholder="Student ID" class="border rounded px-3 h-11 w-full mb-2"><textarea id="ptMsg" placeholder="Message to Parent" class="border rounded px-3 py-2 w-full h-24"></textarea><button onclick="sendPT()" class="mt-2 bg-[#1e3442] text-white px-4 py-2 rounded">Send</button></div></div>`;}
function sendPT(){const id=document.getElementById('ptId').value; const msg=document.getElementById('ptMsg').value; let all=getLS('sef_pt_all',[]); all.unshift({id,msg,date:new Date().toLocaleString()}); setLS('sef_pt_all',all); alert('Sent to parent of '+id);}
function adminDashboard(){document.getElementById('app').innerHTML=`<div class="max-w-6xl mx-auto min-h-screen bg-[#f6f7fb]"><div class="bg-white p-4 border-b flex justify-between"><div class="flex gap-3"><img src="logo.png" class="w-12 h-12 rounded-full"><div><h1 class="font-black text-xl">Master Admin - SEF Dahod NGO Control Room - Full School Manage</h1><p class="text-[11px]">83 Students | Staff + Fees + Notice + DB</p></div></div><button onclick="logout()" class="bg-gray-100 px-5 py-2 rounded-full">Logout</button></div><div class="p-3 flex gap-2 overflow-auto border-b bg-white text-sm"><button onclick="adminTab('students')" id="tab-students" class="bg-[#1e3442] text-white px-4 py-2 rounded-full">➕ New Admission / Student Register</button><button onclick="adminTab('teachers')" id="tab-teachers" class="bg-gray-100 px-4 py-2 rounded-full">💼 Staff / Teacher Management + Salary</button><button onclick="adminTab('fees')" id="tab-fees" class="bg-green-600 text-white px-4 py-2 rounded-full">💵 Fee Collection Dashboard (Razorpay Sync Live)</button><button onclick="adminTab('announce')" id="tab-announce" class="bg-gray-100 px-4 py-2 rounded-full">📢 Global Notice Broadcast - Flash All Mobiles</button><button onclick="adminTab('db')" id="tab-db" class="bg-red-600 text-white px-4 py-2 rounded-full">❌ Core Database Control Delete/Edit</button></div><div id="adminContent" class="p-4"></div></div>`; adminTab('students');}
function adminTab(tab){const c=document.getElementById('adminContent'); if(tab==='students'){c.innerHTML=`<div class="bg-white rounded-xl border p-4"><div class="flex justify-between"><h3 class="font-bold">➕ New Admission - Allot Admission No + Set Password</h3><button onclick="addStudent()" class="bg-[#1e3442] text-white px-4 py-2 rounded-full text-sm">+ New Admission</button></div><div class="mt-4 overflow-auto"><table class="w-full text-sm"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Action</th></tr></thead><tbody>${STUDENTS.map(s=>{const paid=getLS('sef_paid_fees_'+s.id,[]); function b(q){const is=paid.includes(q); return `<button onclick="adminTogglePaid('${s.id}','${q}')" class="${is?'bg-green-600 text-white':'bg-gray-100'} px-2 py-1 rounded-full text-[10px]">${is?'✅':'☐'} ${q}</button>`;} return `<tr class="border-b"><td class="font-bold">${s.id}</td><td>${s.name}</td><td>${s.class}</td><td>${b('Q1 Fees')}</td><td>${b('Q2 Fees')}</td><td>${b('Q3 Fees')}</td><td>${b('Q4 Fees')}</td><td><button onclick="editStudent('${s.id}')" class="text-blue-600 mr-1">Edit</button><button onclick="deleteStudent('${s.id}')" class="text-red-600">Del</button></td></tr>`}).join('')}</tbody></table></div></div>`; return;} if(tab==='teachers'){c.innerHTML=`<div class="bg-white rounded-xl border p-4"><h3 class="font-bold">💼 Staff / Teacher Management - Add Teacher + ID + Salary</h3><button onclick="addTeacher()" class="bg-[#1e3442] text-white px-4 py-2 rounded-full text-sm mt-2">+ Add Teacher Job</button><div class="mt-4">${TEACHERS_DATA.map(t=>`<div class="border p-3 rounded-xl flex justify-between mb-2"><span>${t.id} - ${t.name} - Salary ₹${t.salary}</span><span><button onclick="editTeacher('${t.id}')" class="text-blue-600">Edit</button><button onclick="deleteTeacher('${t.id}')" class="text-red-600 ml-2">Del</button></span></div>`).join('')}</div></div>`; return;} if(tab==='fees'){const all=getLS('sef_fees_collection',[]); const tot=all.reduce((a,b)=>a+(b.amount||0),0); c.innerHTML=`<div class="bg-green-600 text-white rounded-xl p-6"><h2 class="text-3xl font-black">₹${tot}</h2><p>${all.length} Payments - Live Bank Sync - Razorpay</p></div><div class="mt-4 bg-white rounded-xl border p-4 overflow-auto"><table class="w-full text-sm"><thead><tr><th>Date</th><th>ID</th><th>Name</th><th>Fees</th><th>Amount</th></tr></thead><tbody>${all.map(f=>`<tr class="border-b"><td>${f.date}</td><td>${f.studentId}</td><td>${f.studentName}</td><td>${f.feesNames}</td><td>₹${f.amount}</td></tr>`).join('')||'<tr><td colspan="5" class="p-8 text-center">No fees</td></tr>'}</tbody></table></div>`; return;} if(tab==='announce'){const list=getLS('sef_announce',[]); c.innerHTML=`<div class="bg-white rounded-xl border p-4"><h3 class="font-bold">📢 Global Notice Broadcast - All Mobiles Flash at Once</h3><div class="grid grid-cols-4 gap-2 mt-3"><input id="annTitle" placeholder="Message - All Students + Teachers" class="border rounded-xl px-3 h-11 col-span-2"><select id="annType" class="border rounded-xl px-3 h-11"><option>Notice</option><option>Event</option><option>Competition</option><option>Holiday</option></select><input id="annDate" type="date" class="border rounded-xl px-3 h-11"><button onclick="addAnn()" class="bg-red-600 text-white rounded-xl col-span-4 py-2">🚀 Broadcast All Mobiles Flash</button></div><div class="mt-4">${list.map((a,i)=>`<div class="border rounded p-3 flex justify-between mb-2"><span>${a.title} (${a.type}) ${a.date}</span><button onclick="delAnn(${i})" class="text-red-500">Del</button></div>`).join('')}</div></div>`; return;} if(tab==='db'){c.innerHTML=`<div class="bg-white rounded-xl border p-4"><h3 class="font-bold text-red-600">❌ Core Database Control - Delete / Edit Full Authority - Galat Record Fix</h3><p class="text-xs mt-2">Student / Teacher record galat hone par delete/edit ka pura adhikar</p><div class="mt-4 grid grid-cols-2 gap-4"><div><h4 class="font-bold text-sm">Students (${STUDENTS.length})</h4><div class="max-h-64 overflow-auto border rounded p-2 mt-2">${STUDENTS.map(s=>`<div class="flex justify-between border-b py-1 text-sm"><span>${s.id} ${s.name}</span><span><button onclick="editStudent('${s.id}')" class="text-blue-600">Edit</button><button onclick="deleteStudent('${s.id}')" class="text-red-600 ml-1">Del</button></span></div>`).join('')}</div></div><div><h4 class="font-bold text-sm">Teachers</h4><div class="border rounded p-2 mt-2">${TEACHERS_DATA.map(t=>`<div class="flex justify-between border-b py-1 text-sm"><span>${t.id} ${t.name}</span><span><button onclick="editTeacher('${t.id}')" class="text-blue-600">Edit</button><button onclick="deleteTeacher('${t.id}')" class="text-red-600 ml-1">Del</button></span></div>`).join('')}<button onclick="if(confirm('Clear All DB?')){localStorage.clear(); location.reload();}" class="w-full mt-4 bg-red-600 text-white py-2 rounded">Clear All DB</button></div></div></div></div>`; return;}}
function addStudent(){const id=prompt('Admission No'); const name=prompt('Name'); if(id&&name){STUDENTS.push({id,name,class:'8th',father:'',mobile:''}); setLS('sef_final_students_v83',STUDENTS); adminTab('students');}}
function editStudent(id){const s=STUDENTS.find(x=>x.id===id); const n=prompt('Name:',s.name); if(n!==null) s.name=n; setLS('sef_final_students_v83',STUDENTS); adminTab('students');}
function deleteStudent(id){if(confirm('Delete '+id+'?')){STUDENTS=STUDENTS.filter(x=>x.id!==id); setLS('sef_final_students_v83',STUDENTS); adminTab('students');}}
function addTeacher(){const id=prompt('Teacher ID'); const name=prompt('Name'); const sub=prompt('Subject'); const sal=prompt('Salary'); TEACHERS_DATA.push({id,name,subject:sub||'General',salary:sal||'20000'}); adminTab('teachers');}
function editTeacher(id){const t=TEACHERS_DATA.find(x=>x.id===id); const n=prompt('Name:',t.name); if(n!==null) t.name=n; const sal=prompt('Salary:',t.salary); if(sal!==null) t.salary=sal; adminTab('teachers');}
function deleteTeacher(id){const i=TEACHERS_DATA.findIndex(x=>x.id===id); if(i>=0) TEACHERS_DATA.splice(i,1); adminTab('teachers');}
function adminTogglePaid(id,q){let paid=getLS('sef_paid_fees_'+id,[]); if(paid.includes(q)) paid=paid.filter(x=>x!==q); else {paid.push(q); let all=getLS('sef_fees_collection',[]); all.push({id:Date.now(),studentId:id,studentName:(STUDENTS.find(s=>s.id===id)||{}).name||'',amount:7500,feesNames:q,paymentId:'ADMIN-'+Date.now(),date:new Date().toLocaleString()}); setLS('sef_fees_collection',all);} setLS('sef_paid_fees_'+id,paid); adminTab('students');}
function addAnn(){const t=document.getElementById('annTitle').value; const ty=document.getElementById('annType').value; const d=document.getElementById('annDate').value||new Date().toLocaleDateString(); if(!t) return; const l=getLS('sef_announce',[]); l.unshift({title:t,type:ty,date:d}); setLS('sef_announce',l); adminTab('announce');}
function delAnn(i){const l=getLS('sef_announce',[]); l.splice(i,1); setLS('sef_announce',l); adminTab('announce');}
function payOne(name,amt){const opt={key:RAZOR_KEY,amount:amt*100,currency:"INR",name:"Rainbow Public School",description:name,handler:function(r){let all=getLS('sef_fees_collection',[]); all.push({id:Date.now(),studentId:cur.id,studentName:cur.name,amount:amt,feesNames:name,paymentId:r.razorpay_payment_id,date:new Date().toLocaleString()}); setLS('sef_fees_collection',all); let paid=getLS('sef_paid_fees_'+cur.id,[]); if(!paid.includes(name)) paid.push(name); setLS('sef_paid_fees_'+cur.id,paid); alert('Paid '+name);},prefill:{name:cur.name},theme:{color:"#1e3442"}}; new Razorpay(opt).open();}
window.onload=()=>{loginPage();};
</script></body></html>
