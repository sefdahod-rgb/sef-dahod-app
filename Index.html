<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rainbow Public School - Dahod</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head>
<body class="bg-[#eef2f7] font-sans"><div id="app"></div>
<script>
const RAZOR_KEY="rzp_live_SeDR91zuvNa9fG";
const STUDENTS_DATA=[
{"id":"52","name":"Mayank Bariya","class":"8th","father":"Sureshbhai","mobile":"9723675167"},
{"id":"69","name":"Dhearya Parmar","class":"8th","father":"Kiritkumar","mobile":"9723675168"},
{"id":"74","name":"Vansh Devda","class":"8th","father":"Sunilbhai","mobile":"9723675169"},
{"id":"80","name":"Vihan Sangada","class":"8th","father":"Mukeshbhai","mobile":"9723675170"},
{"id":"215","name":"Siddhi Bariya","class":"3rd","father":"Sureshbhai","mobile":"9723675228"}
];
const TEACHERS_DATA=[{"id":"T01","name":"Ramesh Sir","subject":"Maths","salary":"25000"}];
let STUDENTS=JSON.parse(localStorage.getItem('sef_students')||'null')||STUDENTS_DATA;
let cur=null;
const getLS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}};
const setLS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function logout(){cur=null; loginPage();}
function loginPage(m=""){
document.getElementById('app').innerHTML=`
<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#0f2027] via-[#203a43] to-[#2c5364]">
<div class="w-full max-w-[380px] bg-white rounded-[24px] shadow-2xl overflow-hidden">
<div class="bg-[#1e3442] p-8 text-center">
<img src="logo.png" onerror="this.src='https://via.placeholder.com/88'" class="w-24 h-24 rounded-full mx-auto bg-white p-1 border-4 border-white shadow-xl">
<h1 class="font-black text-[18px] mt-4 text-white">RAINBOW PUBLIC SCHOOL</h1>
<p class="text-[10px] text-[#ff9f1c] font-bold mt-1">CONDUCTED BY SHUBHI EDUCATION FOUNDATION</p>
${m?`<div class="bg-red-500 text-white p-2 rounded mt-4 text-xs">${m}</div>`:''}
</div>
<div class="h-1 bg-[#ff9f1c]"></div>
<div class="p-8 space-y-5">
<div><label class="text-[11px] font-bold text-gray-500">USER ID / ADMISSION NO.</label><input id="uid" placeholder="e.g. 52 or admin" class="w-full h-12 bg-[#f8fafc] border-2 border-gray-100 rounded-xl px-4 mt-2 font-semibold"></div>
<div><label class="text-[11px] font-bold text-gray-500">SECURITY PASSWORD</label><input id="pwd" type="password" placeholder="Password" class="w-full h-12 bg-[#f8fafc] border-2 border-gray-100 rounded-xl px-4 mt-2"></div>
<button onclick="doLogin()" class="w-full h-12 bg-[#1e3442] text-white rounded-xl font-bold">Secure Login →</button>
<p class="text-center text-[10px] text-gray-400">admin/admin | Student: 52/52 | Teacher: T01/T01</p>
</div></div></div>`;
}
function doLogin(){
const u=document.getElementById('uid').value.trim().toLowerCase();
const p=document.getElementById('pwd').value.trim().toLowerCase();
if(!u||!p){loginPage('ID Password bharo');return;}
if(u==='admin'&&p==='admin'){cur={id:'ADMIN',name:'Admin',role:'admin'}; adminDashboard();return;}
const t=TEACHERS_DATA.find(x=>x.id.toLowerCase()===u);
if(t){cur={...t,role:'teacher'}; teacherDashboard();return;}
const s=STUDENTS.find(x=>x.id.toLowerCase()===u);
if(!s){loginPage('ID nahi mila - 52 try karo');return;}
if(s.id.toLowerCase()!==p){loginPage('Password = Admission No');return;}
cur={...s,role:'student'}; studentDashboard();
}
function studentDashboard(){
const s=cur; const att=getLS('sef_att_'+s.id,{present:165,absent:5,holiday:10}); const hist=getLS('sef_att_hist_'+s.id,[]); const marks=getLS('sef_marks_'+s.id,{theory:65,practical:15,grade:'B'}); const paid=getLS('sef_paid_'+s.id,[]); const ann=getLS('sef_announce',[]); const hw=getLS('sef_homework',[]);
document.getElementById('app').innerHTML=`
<div class="max-w-md mx-auto min-h-screen bg-[#f6f7fb] pb-20">
<div class="bg-[#1e3442] p-6 rounded-b-[32px] text-white">
<div class="flex justify-between"><div class="flex gap-3"><div class="w-14 h-14 bg-white text-[#1e3442] rounded-full flex items-center justify-center font-black text-xl">${s.name[0]}</div><div><h2 class="font-bold text-[15px]">${s.name}</h2><p class="text-[11px] opacity-80">${s.id} | ${s.class} | ${s.father}</p></div></div><button onclick="logout()" class="w-10 h-10 bg-white text-[#1e3442] rounded-full shadow-lg"><i class="fa-solid fa-right-from-bracket"></i></button></div>
<div class="mt-4 grid grid-cols-3 gap-2"><div class="bg-white text-gray-800 rounded-xl p-2 text-center"><p class="text-[10px] text-gray-400">PRESENT</p><p class="font-black text-green-600">${att.present}</p></div><div class="bg-white text-gray-800 rounded-xl p-2 text-center"><p class="text-[10px] text-gray-400">ABSENT</p><p class="font-black text-red-600">${att.absent}</p></div><div class="bg-white text-gray-800 rounded-xl p-2 text-center"><p class="text-[10px] text-gray-400">HOLIDAY</p><p class="font-black text-orange-500">${att.holiday}</p></div></div></div>
<div class="p-4 space-y-3">
<div class="bg-white rounded-2xl p-4 border shadow-sm"><h3 class="font-bold text-sm">👤 My Profile - Name, Photo, Class, Parent</h3><div class="flex gap-3 mt-2"><img src="logo.png" class="w-16 h-16 rounded-full border"><div class="text-xs"><p><b>Name:</b> ${s.name}</p><p><b>Class:</b> ${s.class}</p><p><b>Father:</b> ${s.father}</p></div></div></div>
<div class="bg-white rounded-2xl p-4 border shadow-sm"><h3 class="font-bold text-sm">📅 Live Attendance - Green P / Red A</h3><div class="grid grid-cols-7 gap-1 mt-3 text-[10px]">${Array.from({length:30},(_,i)=>{const isP=hist[i]?hist[i]==='P':(i%7!==0); return `<div class="h-9 flex flex-col items-center justify-center rounded ${isP?'bg-green-100 text-green-800 border border-green-300':'bg-red-100 text-red-800 border border-red-300'}"><span>${i+1}</span><span class="font-bold">${isP?'P':'A'}</span></div>`}).join('')}</div></div>
<div class="bg-white rounded-2xl p-4 border shadow-sm"><h3 class="font-bold text-sm">📊 Report Card - Theory+Practical+Grade A/B/C</h3><div class="grid grid-cols-3 gap-2 mt-3 text-center"><div class="bg-blue-50 rounded-xl p-3"><p class="text-[10px]">Theory</p><p class="font-black">${marks.theory}/80</p></div><div class="bg-green-50 rounded-xl p-3"><p class="text-[10px]">Practical</p><p class="font-black">${marks.practical}/20</p></div><div class="bg-purple-50 rounded-xl p-3"><p class="text-[10px]">Grade</p><p class="font-black text-xl">${marks.grade}</p></div></div></div>
<div class="bg-white rounded-2xl p-4 border shadow-sm"><h3 class="font-bold text-sm">💰 Fee Payment Razorpay - Baki/Jama + Pay Button</h3><p class="text-xs">Paid: ${paid.join(', ')||'None'}</p><div class="mt-3 space-y-2">${['Q1 Fees','Q2 Fees','Q3 Fees','Q4 Fees'].map(q=>{const is=paid.includes(q); return `<div class="flex justify-between border rounded-xl p-3 ${is?'bg-green-50':''}"><span>${q} ${is?'✅ PAID':''}</span>${!is?`<button onclick="payOne('${q}',7500)" class="bg-[#1e3442] text-white px-4 py-1 rounded-full text-xs">Pay ₹7500</button>`:''}</div>`}).join('')}</div></div>
<div class="bg-white rounded-2xl p-4 border shadow-sm"><h3 class="font-bold text-sm">📢 Notice Board</h3><div class="mt-2">${ann.slice(0,3).map(a=>`<div class="border-l-4 border-[#1e3442] pl-3 py-1 mb-2"><p class="font-bold text-xs">${a.title}</p><p class="text-[11px]">${a.date}</p></div>`).join('')||'No notices'}</div></div>
<div class="bg-white rounded-2xl p-4 border shadow-sm"><h3 class="font-bold text-sm">📝 Homework Section</h3><div class="mt-2">${hw.slice(0,3).map(h=>`<div class="bg-gray-50 p-3 rounded-xl mb-2"><p class="font-bold text-xs">${h.title}</p></div>`).join('')||'No HW'}</div></div>
</div></div>`;
}
function teacherDashboard(){
document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto min-h-screen bg-[#f6f7fb] p-4"><div class="bg-[#1e3442] text-white p-5 rounded-[16px] flex justify-between"><div><h1 class="font-bold text-lg">Teacher - ${cur.name}</h1><p class="text-xs">📅 My Timetable</p></div><button onclick="logout()" class="bg-white text-[#1e3442] px-5 py-2 rounded-full font-bold">Logout</button></div><div class="grid grid-cols-2 gap-4 mt-5"><div onclick="teacherAttendance()" class="bg-white rounded-[16px] p-5 border text-center cursor-pointer"><p class="text-3xl">📝</p><p class="font-bold text-sm mt-2">Daily Attendance Entry - One Click P/A</p></div><div onclick="teacherMarks()" class="bg-white rounded-[16px] p-5 border text-center cursor-pointer"><p class="text-3xl">✍</p><p class="font-bold text-sm mt-2">Marks Entry Portal - Theory+Practical</p></div><div onclick="teacherHomework()" class="bg-white rounded-[16px] p-5 border text-center cursor-pointer"><p class="text-3xl">📚</p><p class="font-bold text-sm mt-2">Daily Homework Upload - PDF Notes</p></div><div onclick="teacherPT()" class="bg-white rounded-[16px] p-5 border text-center cursor-pointer"><p class="text-3xl">💬</p><p class="font-bold text-sm mt-2">Parent-Teacher Communication</p></div></div></div>`;
}
function teacherAttendance(){document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-4"><h3 class="font-bold">📝 Daily Attendance Entry - One Click P/A</h3><button onclick="teacherDashboard()" class="bg-gray-100 px-4 py-2 rounded-full">Back</button><div class="mt-4 bg-white rounded-xl p-4 border"><table class="w-full text-sm"><thead><tr><th>ID</th><th>Name</th><th>Action</th></tr></thead><tbody>${STUDENTS.slice(0,10).map(s=>`<tr class="border-b"><td>${s.id}</td><td>${s.name}</td><td><button onclick="markAtt('${s.id}','P')" class="bg-green-600 text-white px-4 py-1 rounded-full mr-2">P</button><button onclick="markAtt('${s.id}','A')" class="bg-red-600 text-white px-4 py-1 rounded-full">A</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function markAtt(id,t){let h=getLS('sef_att_hist_'+id,[]); h.push(t); setLS('sef_att_hist_'+id,h); let at=getLS('sef_att_'+id,{present:0,absent:0,holiday:10}); if(t==='P') at.present++; else at.absent++; setLS('sef_att_'+id,at); alert(id+' Marked '+t);}
function teacherMarks(){document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-4"><h3 class="font-bold">✍ Marks Entry Portal</h3><button onclick="teacherDashboard()" class="bg-gray-100 px-4 py-2 rounded-full">Back</button><div class="mt-4 bg-white rounded-xl p-4 border grid grid-cols-4 gap-3"><input id="mId" placeholder="Admission No" class="border rounded-xl px-3 h-11"><input id="mTh" placeholder="Theory /80" class="border rounded-xl px-3 h-11"><input id="mPr" placeholder="Practical /20" class="border rounded-xl px-3 h-11"><button onclick="saveMarks()" class="bg-[#1e3442] text-white rounded-xl">Save</button></div></div>`;}
function saveMarks(){const id=document.getElementById('mId').value; const th=parseInt(document.getElementById('mTh').value)||0; const pr=parseInt(document.getElementById('mPr').value)||0; const tot=th+pr; let grade='C'; if(tot>=80) grade='A'; else if(tot>=60) grade='B'; setLS('sef_marks_'+id,{theory:th,practical:pr,grade}); alert('Saved '+id+' Grade '+grade);}
function teacherHomework(){document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-4"><h3 class="font-bold">📚 Daily Homework Upload - PDF Notes</h3><button onclick="teacherDashboard()" class="bg-gray-100 px-4 py-2 rounded-full">Back</button><div class="mt-4 bg-white rounded-xl p-4 border"><input id="hwTitle" placeholder="Homework Title" class="border rounded-xl px-3 h-11 w-full mb-3"><input id="hwClass" placeholder="Class" class="border rounded-xl px-3 h-11 w-full mb-3"><button onclick="uploadHW()" class="bg-[#1e3442] text-white px-6 py-2 rounded-xl">Upload</button></div></div>`;}
function uploadHW(){const t=document.getElementById('hwTitle').value; const c=document.getElementById('hwClass').value||'All'; const l=getLS('sef_homework',[]); l.unshift({title:t,class:c,from:new Date().toLocaleDateString(),to:new Date().toLocaleDateString()}); setLS('sef_homework',l); alert('Uploaded');}
function teacherPT(){document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-4"><h3 class="font-bold">💬 Parent-Teacher Communication</h3><button onclick="teacherDashboard()" class="bg-gray-100 px-4 py-2 rounded-full">Back</button><div class="mt-4 bg-white rounded-xl p-4 border"><input id="ptId" placeholder="Student ID" class="border rounded-xl px-3 h-11 w-full mb-3"><textarea id="ptMsg" placeholder="Message to Parent" class="border rounded-xl px-3 py-2 w-full h-24"></textarea><button onclick="sendPT()" class="mt-3 bg-[#1e3442] text-white px-6 py-2 rounded-xl">Send</button></div></div>`;}
function sendPT(){const id=document.getElementById('ptId').value; const msg=document.getElementById('ptMsg').value; let all=getLS('sef_pt_all',[]); all.unshift({id,msg,date:new Date().toLocaleString()}); setLS('sef_pt_all',all); alert('Sent to parent of '+id);}
function adminDashboard(){document.getElementById('app').innerHTML=`<div class="max-w-6xl mx-auto min-h-screen bg-[#f6f7fb]"><div class="bg-white p-4 border-b flex justify-between sticky top-0"><div class="flex items-center gap-3"><img src="logo.png" class="w-12 h-12 rounded-full"><div><h1 class="font-black text-xl">Master Admin - SEF Dahod NGO Control Room</h1><p class="text-[11px]">83 Students | Staff + Fees + Notice + DB</p></div></div><button onclick="logout()" class="bg-gray-100 px-5 py-2 rounded-full font-bold">Logout</button></div><div class="p-3 flex gap-2 overflow-auto border-b bg-white text-sm"><button onclick="adminTab('students')" id="tab-students" class="bg-[#1e3442] text-white px-4 py-2 rounded-full font-bold">➕ New Admission / Students</button><button onclick="adminTab('teachers')" id="tab-teachers" class="bg-gray-100 px-4 py-2 rounded-full">💼 Staff Management + Salary</button><button onclick="adminTab('fees')" id="tab-fees" class="bg-green-600 text-white px-4 py-2 rounded-full">💵 Fee Collection (Razorpay Sync Live)</button><button onclick="adminTab('announce')" id="tab-announce" class="bg-gray-100 px-4 py-2 rounded-full">📢 Global Notice Broadcast</button><button onclick="adminTab('db')" id="tab-db" class="bg-red-600 text-white px-4 py-2 rounded-full">❌ Core Database Control</button></div><div id="adminContent" class="p-4"></div></div>`; adminTab('students');}
function adminTab(tab){document.querySelectorAll('[id^="tab-"]').forEach(b=>b.className="bg-gray-100 px-4 py-2 rounded-full text-sm"); const a=document.getElementById('tab-'+tab); if(a) a.className="bg-[#1e3442] text-white px-4 py-2 rounded-full font-bold"; const c=document.getElementById('adminContent');
if(tab==='students'){c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><div class="flex justify-between"><h3 class="font-bold">➕ New Admission / Student Register - Allot Admission No + Set Password</h3><button onclick="addStudent()" class="bg-[#1e3442] text-white px-4 py-2 rounded-full text-sm">+ New Admission</button></div><div class="mt-4 overflow-auto"><table class="w-full text-sm"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Edit/Delete</th></tr></thead><tbody>${STUDENTS.map(s=>{const paid=getLS('sef_paid_fees_'+s.id,[]); function btn(q){const is=paid.includes(q); return `<button onclick="adminTogglePaid('${s.id}','${q}')" class="${is?'bg-green-600 text-white':'bg-gray-100'} px-2 py-1 rounded-full text-[10px]">${is?'✅':'☐'} ${q}</button>`;} return `<tr class="border-b"><td class="font-bold">${s.id}</td><td>${s.name}</td><td>${s.class}</td><td>${btn('Q1 Fees')}</td><td>${btn('Q2 Fees')}</td><td>${btn('Q3 Fees')}</td><td>${btn('Q4 Fees')}</td><td><button onclick="editStudent('${s.id}')" class="text-blue-600 mr-1">Edit</button><button onclick="deleteStudent('${s.id}')" class="text-red-600">Del</button></td></tr>`}).join('')}</tbody></table></div></div>`; return;}
if(tab==='teachers'){c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><h3 class="font-bold">💼 Staff / Teacher Management - Add Teacher + ID + Salary Set</h3><button onclick="addTeacher()" class="bg-[#1e3442] text-white px-4 py-2 rounded-full text-sm mt-2">+ Add Teacher Job</button><div class="mt-4 space-y-2">${TEACHERS_DATA.map(t=>`<div class="border p-3 rounded-xl flex justify-between"><span>${t.id} - ${t.name} (${t.subject}) - Salary ₹${t.salary}/month</span><span><button onclick="editTeacher('${t.id}')" class="text-blue-600 mr-2">Edit Salary</button><button onclick="deleteTeacher('${t.id}')" class="text-red-600">Delete</button></span></div>`).join('')}</div></div>`; return;}
if(tab==='fees'){const all=getLS('sef_fees_collection',[]); const total=all.reduce((s,f)=>s+(f.amount||0),0); c.innerHTML=`<div class="bg-green-600 text-white rounded-[20px] p-6"><h2 class="text-4xl font-black">₹${total}</h2><p>${all.length} Payments - Live Bank Sync - Razorpay</p></div><div class="mt-4 bg-white rounded-[20px] border p-4 overflow-auto"><table class="w-full text-sm"><thead><tr><th>Date</th><th>ID</th><th>Name</th><th>Fees</th><th>Amount</th></tr></thead><tbody>${all.map(f=>`<tr class="border-b"><td>${f.date}</td><td>${f.studentId}</td><td>${f.studentName}</td><td>${f.feesNames}</td><td>₹${f.amount}</td></tr>`).join('')||'<tr><td colspan="5" class="p-8 text-center text-gray-400">No fees - Razorpay Sync Live List will appear here</td></tr>'}</tbody></table></div>`; return;}
if(tab==='announce'){const list=getLS('sef_announce',[]); c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><h3 class="font-bold">📢 Global Notice Broadcast - Message Flash to All Students + Teachers Mobile at Once</h3><div class="grid grid-cols-4 gap-2 mt-3"><input id="annTitle" placeholder="Notice Message - e.g. Kal Holiday" class="border rounded-xl px-3 h-11 col-span-2"><select id="annType" class="border rounded-xl px-3 h-11"><option>Notice</option><option>Event</option><option>Competition</option><option>Holiday</option></select><input id="annDate" type="date" class="border rounded-xl px-3 h-11"><button onclick="addAnn()" class="bg-red-600 text-white px-4 rounded-xl col-span-4 py-2">🚀 Broadcast to All - Flash Message to All Mobiles</button></div><p class="text-[11px] text-gray-500 mt-2">Yahan se likha message pure school (all teachers + all 83 students) ke mobile par ek sath flash ho jayega</p><div class="mt-4 space-y-2">${list.map((a,i)=>`<div class="border rounded-xl p-3 flex justify-between"><div><p class="font-bold text-sm">${a.title} <span class="text-[10px] bg-gray-100 px-2 py-0.5 rounded-full">${a.type}</span></p><p class="text-xs text-gray-500">${a.date}</p></div><button onclick="delAnn(${i})" class="text-red-500 text-sm">Delete</button></div>`).join('')||'<p class="text-gray-400 text-sm">No broadcasts yet</p>'}</div></div>`; return;}
if(tab==='db'){c.innerHTML=`<div class="bg-white rounded-[20px] border p-4"><h3 class="font-bold text-red-600">❌ Core Database Control - Full Authority Delete / Edit (Galat Record Fix)</h3><p class="text-xs text-gray-600 mt-2">Kisi student ya teacher ka record galat hone par yahan se delete ya edit karne ka pura adhikar - NGO Control Room</p><div class="grid grid-cols-2 gap-4 mt-4"><div><h4 class="font-bold text-sm">Students DB (${STUDENTS.length}) - Edit/Delete</h4><div class="mt-2 max-h-64 overflow-auto border rounded-xl p-2">${STUDENTS.map(s=>`<div class="flex justify-between border-b py-2 text-sm"><span>${s.id} ${s.name}</span><span><button onclick="editStudent('${s.id}')" class="text-blue-600 mr-2">Edit</button><button onclick="deleteStudent('${s.id}')" class="text-red-600">Delete</button></span></div>`).join('')}</div></div><div><h4 class="font-bold text-sm">Teachers DB - Edit/Delete</h4><div class="mt-2 border rounded-xl p-2">${TEACHERS_DATA.map(t=>`<div class="flex justify-between border-b py-2 text-sm"><span>${t.id} ${t.name}</span><span><button onclick="editTeacher('${t.id}')" class="text-blue-600 mr-2">Edit</button><button onclick="deleteTeacher('${t.id}')" class="text-red-600">Delete</button></span></div>`).join('')}<button onclick="if(confirm('Clear All DB?')){localStorage.clear(); location.reload();}" class="w-full mt-4 bg-red-600 text-white py-2 rounded">Clear All DB</button></div></div></div></div>`; return;}
}
function addStudent(){const id=prompt('Admission No allot karo:'); if(!id) return; const name=prompt('Name:'); if(!name) return; const cls=prompt('Class:'); const father=prompt('Father Name:'); const mob=prompt('Mobile:'); STUDENTS.push({id,name,class:cls||'8th',father:father||'',mobile:mob||''}); setLS('sef_students',STUDENTS); adminTab('students');}
function editStudent(id){const s=STUDENTS.find(x=>x.id===id); if(!s) return; const n=prompt('Name Edit:',s.name); if(n!==null) s.name=n; setLS('sef_students',STUDENTS); adminTab('students');}
function deleteStudent(id){if(!confirm('Delete Student '+id+'?')) return; STUDENTS=STUDENTS.filter(x=>x.id!==id); setLS('sef_students',STUDENTS); adminTab('students');}
function addTeacher(){const id=prompt('Teacher ID banao:'); if(!id) return; const name=prompt('Name:'); if(!name) return; const sub=prompt('Subject:'); const sal=prompt('Salary:'); TEACHERS_DATA.push({id,name,subject:sub||'General',salary:sal||'20000'}); adminTab('teachers');}
function editTeacher(id){const t=TEACHERS_DATA.find(x=>x.id===id); if(!t) return; const n=prompt('Name:',t.name); if(n!==null) t.name=n; const sal=prompt('Salary:',t.salary); if(sal!==null) t.salary=sal; adminTab('teachers');}
function deleteTeacher(id){const i=TEACHERS_DATA.findIndex(x=>x.id===id); if(i>=0) TEACHERS_DATA.splice(i,1); adminTab('teachers');}
function adminTogglePaid(id,q){let paid=getLS('sef_paid_fees_'+id,[]); if(paid.includes(q)) paid=paid.filter(x=>x!==q); else {paid.push(q); let all=getLS('sef_fees_collection',[]); all.push({id:Date.now(),studentId:id,studentName:(STUDENTS.find(s=>s.id===id)||{}).name||'',amount:7500,feesNames:q,paymentId:'ADMIN-'+Date.now(),date:new Date().toLocaleString()}); setLS('sef_fees_collection',all);} setLS('sef_paid_fees_'+id,paid); adminTab('students');}
function addAnn(){const t=document.getElementById('annTitle').value; const ty=document.getElementById('annType').value; const d=document.getElementById('annDate').value||new Date().toLocaleDateString(); if(!t) return; const l=getLS('sef_announce',[]); l.unshift({title:t,type:ty,date:d}); setLS('sef_announce',l); adminTab('announce');}
function delAnn(i){const l=getLS('sef_announce',[]); l.splice(i,1); setLS('sef_announce',l); adminTab('announce');}
function payOne(name,amt){const opt={key:RAZOR_KEY,amount:amt*100,currency:"INR",name:"Rainbow Public School",description:name,handler:function(r){let all=getLS('sef_fees_collection',[]); all.push({id:Date.now(),studentId:cur.id,studentName:cur.name,amount:amt,feesNames:name,paymentId:r.razorpay_payment_id,date:new Date().toLocaleString()}); setLS('sef_fees_collection',all); let paid=getLS('sef_paid_fees_'+cur.id,[]); if(!paid.includes(name)) paid.push(name); setLS('sef_paid_fees_'+cur.id,paid); alert('Fees Paid: '+name);},prefill:{name:cur.name},theme:{color:"#1e3442"}}; new Razorpay(opt).open();}
window.onload=()=>{loginPage();};
